plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.nyccsda.versewidget'
version = '1.0.0'

android {
  namespace "org.nyccsda.versewidget"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation project(':expo-widgets')
  // The same Glance that expo-widgets draws with, for its colors and layout tree.
  implementation 'androidx.glance:glance:1.2.0'
}
