# The church's private Bible Brain proxy (#241). Deploying it is a manual,
# admin-only step: see docs/operations/bible-brain-audio.md.
#
#   npx wrangler@4 secret put BIBLE_BRAIN_KEY   # once; the key never goes in this file
#   npx wrangler@4 deploy
#
# Keep the account on the Workers Free plan. Past its limits, requests fail
# instead of being billed (#261).

name = "nyccsda-bible-brain-audio"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# Comma-separated Bible Brain fileset IDs the app may request, and nothing else.
# Fill in after scripts/bible-brain-discover.cjs confirms the Cantonese audio
# filesets and FCBH approves the design.
ALLOWED_FILESETS = ""
# Websites whose pages may call the Worker. The app itself sends no Origin.
ALLOWED_ORIGINS = "https://app.nyccsda.org"

# A per-address limit, so the Worker can't serve as a relay. A listener plays
# about one chapter a minute at most; 60 a minute leaves room for skipping.
# If deploy rejects this block on the Free plan, remove it; the Worker then
# runs without it.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2410"

  [ratelimits.simple]
  limit = 60
  period = 60
