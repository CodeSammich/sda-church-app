# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"        # Checks for new framework versions once a week
    open-pull-requests-limit: 3 # Prevents getting flooded with too many open PRs at once
    labels: ["dependencies"]    # Skip the default "javascript" language label
    # One pull request a week for every minor and patch update, instead of one
    # per package; each pull request has to be moved to the release branch by
    # hand, and each push starts CI. Major updates still get their own.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
