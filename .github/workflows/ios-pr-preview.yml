name: iOS PR preview

# The iOS counterpart of android-pr-preview.yml: unsigned iOS Simulator builds
# of a release before it merges into main, for an Apple Silicon Mac and an
# Intel Mac. A Simulator build needs no Apple signing,
# so this workflow reads no secrets and can safely run on pull requests.
# Download the app from the run's artifacts to test it in the Simulator on a
# Mac; docs/operations/native-builds.md explains how.
on:
  # Only the release PR into main. Feature PRs into a release branch skip the
  # Mac builds; start it by hand on a branch to test a change to this workflow
  # or scripts/build-ios-simulator.mjs early.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-pr-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    # A release PR is a release/* branch in this repository. Other PRs into
    # main, such as Dependabot's, can't merge there, so they skip it.
    if: >-
      github.event_name != 'pull_request' ||
      (startsWith(github.head_ref, 'release/') &&
        github.event.pull_request.head.repo.full_name == github.repository)
    # The "Main protection" ruleset requires these job names; rename both together.
    name: Build iOS Simulator app (${{ matrix.mac }} Mac)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Simulator runs apps built for the Mac's own processor, so each
          # kind of Mac gets its own build, checked on a runner of that kind.
          - mac: Apple Silicon
            runner: macos-26
            arch: arm64
          - mac: Intel
            runner: macos-26-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Select and verify Xcode tools
        run: |
          set -euo pipefail
          # Keep this in step with native-ios-build.yml.
          XCODE_DEVELOPER_DIR='/Applications/Xcode_26.6.app/Contents/Developer'
          test -d "$XCODE_DEVELOPER_DIR" || {
            echo "Expected Xcode at $XCODE_DEVELOPER_DIR; update this workflow when the runner image changes." >&2
            exit 1
          }
          sudo xcode-select -s "$XCODE_DEVELOPER_DIR"
          xcodebuild -version
          pod --version
          uname -m

      - name: Install dependencies
        run: npm ci --force

      - name: Generate iOS project
        run: >-
          npx expo prebuild
          --template expo-template-bare-minimum@58.0.9
          --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Build for the Simulator without signing
        env:
          ARCH: ${{ matrix.arch }}
          # Lets the key-screen capture open each screen from a saved setting
          # (services/ScreenshotRoute.ts). Expo writes it into this build only;
          # the store builds in native-ios-build.yml never set it.
          EXPO_PUBLIC_KEY_SCREENS: '1'
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE" || {
            echo 'Expo prebuild did not create an Xcode workspace.' >&2
            exit 1
          }
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-simulator" \
            ARCHS="$ARCH" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch on a simulated iPhone
        env:
          ARCH: ${{ matrix.arch }}
          # Named like the Android preview's sda-church-app-pr-<number>-<run>-arm-debug.apk.
          PREVIEW_NAME: sda-church-app-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'manual' }}-${{ github.run_id }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/ios-simulator/Build/Products/Release-iphonesimulator" \
            -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" || {
            echo 'The build did not produce a Simulator app.' >&2
            exit 1
          }
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw "$APP_PATH/Info.plist")"
          lipo -archs "$APP_PATH/$EXECUTABLE"
          BUNDLE_ID="$(node -p "require('./app.json').expo.ios.bundleIdentifier")"

          # The iPhone test/screens/screens.json names, on the newest installed iOS
          # runtime, so this check and the key screens below share one Simulator.
          DEVICE_ID="$(node scripts/capture-ios-screens.cjs --pick-device)"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"

          # Give the bundled JavaScript time to load and draw the first screen.
          sleep 45
          ARTIFACT_DIR="$RUNNER_TEMP/ios-pr-preview"
          mkdir -p "$ARTIFACT_DIR"
          xcrun simctl io "$DEVICE_ID" screenshot "$ARTIFACT_DIR/$PREVIEW_NAME-first-screen.png"
          (cd "$(dirname "$APP_PATH")" &&
            ditto -c -k --keepParent "$(basename "$APP_PATH")" "$ARTIFACT_DIR/$PREVIEW_NAME-simulator.zip")
          RUNNING_SERVICES="$(xcrun simctl spawn "$DEVICE_ID" launchctl list)"
          grep -q "UIKitApplication:$BUNDLE_ID" <<<"$RUNNING_SERVICES" || {
            echo 'The app is not running 45 seconds after launch; it probably crashed on start.' >&2
            exit 1
          }

      - name: Capture the key screens
        # Screenshots of the screens in test/screens/screens.json, named
        # ios/<screen>-<variant>.png, for checking layouts before release (#331).
        # One set is enough: both builds run the same JavaScript. 66 shots take
        # about 22 minutes, so a second set on the Intel build would only make the
        # release PR wait longer. Actions minutes are free for this public
        # repository, so this is about time, not cost.
        if: matrix.arch == 'arm64'
        timeout-minutes: 35
        run: node scripts/capture-ios-screens.cjs --out "$RUNNER_TEMP/ios-pr-preview/screens"

      - name: Upload the Simulator app and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-pr-preview-${{ github.event.pull_request.number || 'manual' }}-${{ github.run_id }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/ios-pr-preview/
          if-no-files-found: warn
          retention-days: 14

  review-comment:
    # Tells the release PR's reviewer where this commit's screenshots are and
    # how to approve them, for the "Screenshots reviewed" check (#331). Each run
    # replaces the previous comment, so the one on the PR is always current.
    needs: simulator
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Post the screenshot review comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # To find this run's artifact, and whether 👍 approval is on main yet.
      actions: read
      contents: read
      # Only to replace the review comment. The job never checks out or runs
      # the pull request's code.
      pull-requests: write
    steps:
      - name: Post the review comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          CHECKS: ${{ needs.simulator.result }}
        run: |
          set -euo pipefail
          run_url="https://github.com/$REPO/actions/runs/$RUN_ID"
          artifact=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name | endswith("-arm64"))][0] // empty | "\(.id) \(.size_in_bytes)"')
          if [ -n "$artifact" ]; then
            read -r artifact_id artifact_bytes <<<"$artifact"
            download="[the screenshots]($run_url/artifacts/$artifact_id) (a zip of about $((artifact_bytes / 1000000)) MB)"
          else
            download="the screenshots from [the run]($run_url), which uploaded none; it says why"
          fi
          if [ "$CHECKS" = success ]; then
            checks="✅ The automatic checks passed: the app opened every screen, and none is blank or has text behind the status bar."
          else
            checks="⚠️ **The automatic checks failed or didn't finish.** Start with [the run]($run_url) to see why."
          fi
          # The 👍 reply works once screenshot-approval.yml is on main, since
          # GitHub runs comment-triggered workflows from main.
          approve="add the **screenshots reviewed** label."
          if gh api "repos/$REPO/contents/.github/workflows/screenshot-approval.yml?ref=main" --silent 2>/dev/null; then
            approve="add the **screenshots reviewed** label, or reply to this pull request with just 👍."
          fi

          body=$(cat <<BODY
          <!-- key-screens-review sha=$SHA -->
          ### 📸 Screenshots to review

          The iPhone screenshots for commit \`${SHA:0:7}\` are ready. Someone needs to look through them before this release can merge into \`main\`.

          $checks

          1. **Download** $download and open \`screens/ios/\`. Each file is named \`<screen>-<variant>.png\`: \`default\`, \`dark\`, \`large\` and \`xl\` (150% and 200% app text), \`ios-large-text\` (the iPhone's own largest size), and \`zh\`, \`zh-cn\`, and \`es\`.
          2. **Look for** what a person would notice:
             - text cut off, overlapping, or behind the clock, battery, or Dynamic Island;
             - a verse number split from its verse, or a button label cut short;
             - the wrong language, a blank or half-drawn screen, or a popup covering the page;
             - dark mode or large text that's hard to read.

             The black pill at the top is the Simulator's Dynamic Island; a real iPhone's screenshots leave it out.
          3. **Approve:** $approve

          A new push clears the approval, and this comment is replaced when its screenshots are ready. The App Store copies are in \`screens/app-store/\`.
          BODY
          )

          # Replace earlier review comments, so the newest screenshots are the only ones offered.
          gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- key-screens-review"))) | .id' |
            while read -r old; do gh api -X DELETE "repos/$REPO/issues/comments/$old" >/dev/null; done
          gh api "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          echo "Posted the review comment for $SHA."
