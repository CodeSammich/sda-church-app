name: iOS PR preview

# The iOS counterpart of android-pr-preview.yml: an unsigned iOS Simulator
# build of a release before it merges into main, for an Apple Silicon Mac. A
# Simulator build needs no Apple signing,
# so this workflow reads no secrets and can safely run on pull requests.
# Download the app from the run's artifacts to test it in the Simulator on a
# Mac; docs/operations/native-builds.md explains how.
on:
  # Only the release PR into main. Feature PRs into release-candidate skip the
  # Mac builds; start it by hand on a branch to test a change to this workflow
  # or scripts/build-ios-simulator.mjs early.
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      screens_from_run:
        description: >-
          Only check the key screens of an earlier run of this workflow (its run
          ID), without building. For tuning scripts/check-screens.cjs.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ios-pr-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    # A release PR comes from this repository's release-candidate branch.
    # Other PRs into main, such as Dependabot's, can't merge there, so they
    # skip it.
    # Started by hand, it builds unless it was asked only to re-check an
    # earlier run's screenshots.
    if: >-
      (github.event_name != 'pull_request' && inputs.screens_from_run == '') ||
      (github.head_ref == 'release-candidate' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    name: Key screens (${{ matrix.group }})
    # Apple Silicon only. The Intel Mac build was dropped in 1.2.1;
    # docs/operations/native-builds.md ("On an Intel Mac") says how to build one.
    runs-on: macos-26
    # The longest of these jobs took 21.5 to 27.2 minutes per run in October
    # 2026. 40 leaves room for a slow compile or the one 11-minute app install
    # seen, without a stuck job holding a Mac for an hour.
    timeout-minutes: 40
    permissions:
      contents: read
      # To see when the shared app is ready, and whether its runner failed.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # One runner per key-screen group in test/screens/screens.json, each
        # of related screens, so the release PR waits for the slowest group
        # rather than all 85 shots (#453). A test keeps this list and
        # screens.json in step. GitHub's free plan runs five Mac jobs at once.
        # Three Simulators on one runner were slower: its 3 processors couldn't
        # keep up with them.
        group: [home, bible-reading, bible-text, library, worship-and-you]
        # The app is compiled once, by the runner with the smallest group, and
        # shared with the others, which boot their iPhones meanwhile; five
        # separate compiles made the run wait for the slowest of five. A test
        # checks that exactly one group builds and that the others wait for it.
        include:
          - group: bible-text
            builds: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Select and verify Xcode tools
        run: |
          set -euo pipefail
          # Keep this in step with native-ios-build.yml, ios-compile-cache.yml,
          # and the compile-cache keys below.
          XCODE_DEVELOPER_DIR='/Applications/Xcode_26.6.app/Contents/Developer'
          test -d "$XCODE_DEVELOPER_DIR" || {
            echo "Expected Xcode at $XCODE_DEVELOPER_DIR; update this workflow when the runner image changes." >&2
            exit 1
          }
          sudo xcode-select -s "$XCODE_DEVELOPER_DIR"
          xcodebuild -version
          pod --version
          uname -m

      - name: Set up the compile cache
        # ccache reuses the C, C++, and Objective-C that ios-compile-cache.yml
        # compiled on main (#455). Swift is always compiled.
        if: ${{ matrix.builds }}
        run: |
          set -euo pipefail
          command -v ccache >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache
          # React Native's CocoaPods setup compiles through ccache when this is set.
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          # Its ccache-clang.sh calls ccache by CCACHE_BINARY, which Xcode gives
          # to script phases but not to the compiler, so without this every
          # compile skipped ccache. xcodebuild passes its own environment on.
          echo "CCACHE_BINARY=$(command -v ccache)" >> "$GITHUB_ENV"
          # Read-only: reuse main's compiled files, but store nothing, not even
          # on this runner. A pull request's compile never reaches a cache.
          echo "CCACHE_READONLY=1" >> "$GITHUB_ENV"

      # Every runner needs sharp, which the key-screen scripts use.
      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        if: ${{ matrix.builds }}
        run: >-
          npx expo prebuild
          --template expo-template-bare-minimum@58.0.23
          --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        if: ${{ matrix.builds }}
        run: pod install --project-directory=ios

      # Restore only: only main saves this cache, so a pull request can't
      # change what a later run gets, and the signed store builds never use it.
      # The newest cache for these native dependencies, or else main's newest
      # for this Xcode, so a library update recompiles only what it changed.
      # ccache reuses a compiled file only when its compiler, flags, source, and
      # every header it includes hash the same, so an older cache can't put an
      # outdated file in the build.
      - name: Restore the compile cache from main
        if: ${{ matrix.builds }}
        id: compile-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-sim-xcode-26.6-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ccache-ios-sim-xcode-26.6-${{ hashFiles('ios/Podfile.lock') }}-
            ccache-ios-sim-xcode-26.6-

      # ccache keeps its counters in the cache, so start them at zero after
      # restoring it, or the stats after the build would include main's.
      # Zeroing them writes to this runner's copy, so it runs outside
      # read-only mode.
      - name: Count only this build's compile-cache hits
        if: ${{ matrix.builds }}
        run: env -u CCACHE_READONLY ccache --zero-stats

      - name: Boot the simulated iPhone in the background
        # A fresh Simulator's first boot takes about 5.5 minutes on these
        # runners, most of it one iOS data-migration step for location
        # services, and on their 3 processors it slows whatever runs
        # alongside it (docs/operations/native-builds.md). So it starts after
        # the package installs, while the other runners wait for the app. The
        # runner that compiles boots its iPhone after the build, in the launch
        # step, when it restored a compile cache: booting alongside, a build
        # from a matching cache took 10.8 minutes instead of 2.3. With no cache,
        # the compile is long anyway, and booting after it made this runner
        # finish last.
        env:
          BOOT_NOW: ${{ !matrix.builds || steps.compile-cache.outputs.cache-matched-key == '' }}
        run: |
          set -euo pipefail
          # The iPhone test/screens/screens.json names, on the newest installed
          # iOS runtime, so the launch check and the key screens share it.
          DEVICE_ID="$(node scripts/capture-ios-screens.cjs --pick-device)"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          if [ "$BOOT_NOW" = true ]; then
            nohup xcrun simctl bootstatus "$DEVICE_ID" -b > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &
          fi

      - name: Build for the Simulator without signing
        if: ${{ matrix.builds }}
        env:
          ARCH: arm64
          # Lets the key-screen capture open each screen from a saved setting
          # (services/ScreenshotRoute.ts). Expo writes it into this build only;
          # the store builds in native-ios-build.yml never set it.
          EXPO_PUBLIC_KEY_SCREENS: '1'
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE" || {
            echo 'Expo prebuild did not create an Xcode workspace.' >&2
            exit 1
          }
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-simulator" \
            ARCHS="$ARCH" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Show how much the compile cache saved
        if: ${{ matrix.builds && !cancelled() }}
        run: ccache --show-stats

      - name: Zip the app to share
        if: ${{ matrix.builds }}
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/ios-simulator/Build/Products/Release-iphonesimulator" \
            -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" || {
            echo 'The build did not produce a Simulator app.' >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/ios-simulator-app"
          # ditto keeps the app bundle's symbolic links and permissions.
          (cd "$(dirname "$APP_PATH")" &&
            ditto -c -k --keepParent "$(basename "$APP_PATH")" "$RUNNER_TEMP/ios-simulator-app/app.zip")

      - name: Share the app with the other runners
        if: ${{ matrix.builds }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-simulator-app-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-simulator-app/app.zip
          if-no-files-found: error
          retention-days: 1

      - name: Wait for the shared app
        # The bible-text runner uploads it when its compile finishes.
        # Gives up as soon as that runner ends without it, rather than waiting
        # out the timeout.
        if: ${{ !matrix.builds }}
        # The app was ready 13 to 17 minutes into the job; this leaves the rest of the
        # job's 40 minutes for the key screens.
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          until gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].name' |
            grep -qx "ios-simulator-app-$RUN_ID"; do
            builder="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
              --jq '.jobs[] | select(.name == "Key screens (bible-text)") | .conclusion // ""')"
            if [ -n "$builder" ]; then
              echo "::error::The bible-text runner ended ($builder) without sharing the app." >&2
              exit 1
            fi
            sleep 15
          done

      - name: Download the shared app
        if: ${{ !matrix.builds }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ios-simulator-app-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-simulator-app

      - name: Unpack the shared app
        if: ${{ !matrix.builds }}
        run: ditto -x -k "$RUNNER_TEMP/ios-simulator-app/app.zip" "$RUNNER_TEMP/ios-simulator-app"

      - name: Launch on a simulated iPhone
        env:
          BUILDS: ${{ matrix.builds && 'true' || 'false' }}
          # Named like the Android preview's sda-church-app-pr-<number>-<run>-arm-debug.apk.
          PREVIEW_NAME: sda-church-app-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'manual' }}-${{ github.run_id }}-arm64
        run: |
          set -euo pipefail
          # Compiled here, or shared by the runner that compiled it.
          APP_PATH="$(find "$RUNNER_TEMP/ios-simulator/Build/Products/Release-iphonesimulator" \
            "$RUNNER_TEMP/ios-simulator-app" -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)"
          test -n "$APP_PATH" || {
            echo 'No Simulator app was built or shared.' >&2
            exit 1
          }
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw "$APP_PATH/Info.plist")"
          lipo -archs "$APP_PATH/$EXECUTABLE"
          BUNDLE_ID="$(node -p "require('./app.json').expo.ios.bundleIdentifier")"

          # Waits for the boot started earlier, or, on the runner that
          # compiled, boots the iPhone now.
          xcrun simctl bootstatus "$DEVICE_ID" -b
          # The background boot's own log, with timestamps, to see what a slow
          # boot was waiting on.
          if [ -f "$RUNNER_TEMP/simulator-boot.log" ]; then
            echo '::group::Simulated iPhone boot log'
            cat "$RUNNER_TEMP/simulator-boot.log"
            echo '::endgroup::'
          fi
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"

          # Give the bundled JavaScript time to load and draw the first screen.
          sleep 45
          ARTIFACT_DIR="$RUNNER_TEMP/ios-pr-preview"
          mkdir -p "$ARTIFACT_DIR"
          # The download needs one copy of the app; the compiling runner's is kept.
          if [ "$BUILDS" = true ]; then
            xcrun simctl io "$DEVICE_ID" screenshot "$ARTIFACT_DIR/$PREVIEW_NAME-first-screen.png"
            cp "$RUNNER_TEMP/ios-simulator-app/app.zip" "$ARTIFACT_DIR/$PREVIEW_NAME-simulator.zip"
          fi
          RUNNING_SERVICES="$(xcrun simctl spawn "$DEVICE_ID" launchctl list)"
          grep -q "UIKitApplication:$BUNDLE_ID" <<<"$RUNNING_SERVICES" || {
            echo 'The app is not running 45 seconds after launch; it probably crashed on start.' >&2
            exit 1
          }

      - name: Capture the key screens
        # Screenshots of the screens in test/screens/screens.json, named
        # ios/<screen>-<variant>.png, for checking layouts before release (#331).
        # Only this group's screens.
        timeout-minutes: 20
        run: >-
          node scripts/capture-ios-screens.cjs --out "$RUNNER_TEMP/ios-pr-preview/screens"
          --group ${{ matrix.group }}

      - name: Check the text on the key screens
        # Reads each screenshot's text with Apple's Vision framework and checks
        # what every screen must show: tab labels in the right language, the
        # verse button's whole label, verse numbers starting their lines, and no
        # system prompt or setup dialog. Saves ocr.json and checks.json beside
        # the screenshots. Runs even if a capture failed, to report on the rest.
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: >-
          node scripts/check-screens.cjs --dir "$RUNNER_TEMP/ios-pr-preview/screens"
          --group ${{ matrix.group }}

      - name: Upload this group
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: key-screens-${{ github.run_id }}-${{ matrix.group }}
          path: ${{ runner.temp }}/ios-pr-preview/
          if-no-files-found: warn
          retention-days: 1

  simulator:
    # Joins the groups into the one artifact the review comment links: the
    # app and its first screen from the runner that compiled it, and every group's
    # screenshots and checks. It fails if any group failed, so a failed
    # group can't pass as skipped. The "Main protection" ruleset requires
    # this job's name.
    needs: capture
    if: >-
      !cancelled() && (
      (github.event_name != 'pull_request' && inputs.screens_from_run == '') ||
      (github.head_ref == 'release-candidate' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    name: Build iOS Simulator app (Apple Silicon Mac)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # For sharp, which writes the App Store copies.
      - name: Install dependencies
        run: npm ci

      - name: Download the groups
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: key-screens-${{ github.run_id }}-*
          path: ${{ runner.temp }}/parts

      - name: Join the key screens
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ios-pr-preview"
          mkdir -p "$OUT"
          find "$RUNNER_TEMP/parts" -maxdepth 2 -type f \( -name '*-simulator.zip' -o -name '*-first-screen.png' \) \
            -exec cp {} "$OUT/" \;
          node scripts/merge-key-screens.cjs --out "$OUT/screens" "$RUNNER_TEMP"/parts/*/screens

      - name: Upload the Simulator app and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-pr-preview-${{ github.event.pull_request.number || 'manual' }}-${{ github.run_id }}-arm64
          path: ${{ runner.temp }}/ios-pr-preview/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if a group failed
        if: ${{ !cancelled() && needs.capture.result != 'success' }}
        env:
          RESULT: ${{ needs.capture.result }}
        run: |
          echo "::error::A key-screen group ended as $RESULT; its job's log says why."
          exit 1

  announce:
    # Says the screenshots are on the way as soon as a release PR opens or gets
    # a new push, since they take 15 to 25 minutes, and removes the screenshots
    # from before the push, which are out of date (#331). The review-comment
    # job replaces the notice with the screenshots.
    if: >-
      github.event_name == 'pull_request' &&
      github.run_attempt == 1 &&
      github.head_ref == 'release-candidate' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Say the screenshots are on the way
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Only to replace the review comment. The job never checks out or runs
      # the pull request's code.
      pull-requests: write
    steps:
      - name: Post the notice
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          comments=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- key-screens-review"))) | "\(.id) \(.body | split("\n")[0])"')
          # This commit's screenshots are already posted, as when a PR is reopened.
          if grep -qF "<!-- key-screens-review sha=$SHA -->" <<<"$comments"; then exit 0; fi
          # Earlier screenshots are out of date: remove them, and any earlier notice.
          while read -r id _; do
            [ -n "$id" ] && gh api -X DELETE "repos/$REPO/issues/comments/$id" >/dev/null
          done <<<"$comments"
          # Encode any slash in the branch name for the progress link.
          progress="https://github.com/$REPO/actions/workflows/ios-pr-preview.yml?query=branch%3A${HEAD_REF//\//%2F}"
          body=$(cat <<BODY
          <!-- key-screens-review pending sha=$SHA -->
          ### 📸 Screenshots on the way

          The iPhone preview is taking the screenshots for commit \`${SHA:0:7}\`. That takes 15 to 25 minutes ([progress]($progress)). When they're ready, this comment is replaced with them, what to look for, and how to approve them.

          Until an approver reviews them, the **Screenshots reviewed** check waits.
          BODY
          )
          gh api "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null

  review-comment:
    # Tells the release PR's reviewer where this commit's screenshots are and
    # how to approve them, for the "Screenshots reviewed" check (#331). Each run
    # replaces the previous comment, so the one on the PR is always current.
    needs: simulator
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.head_ref == 'release-candidate' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Post the screenshot review comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # To find this run's artifact.
      actions: read
      contents: read
      # Only to replace the review comment. The job never checks out or runs
      # the pull request's code.
      pull-requests: write
    steps:
      - name: Post the review comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          CHECKS: ${{ needs.simulator.result }}
        run: |
          set -euo pipefail
          run_url="https://github.com/$REPO/actions/runs/$RUN_ID"
          artifact=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name | endswith("-arm64"))][0] // empty | "\(.id) \(.size_in_bytes)"')
          if [ -n "$artifact" ]; then
            read -r artifact_id artifact_bytes <<<"$artifact"
            download="[the screenshots]($run_url/artifacts/$artifact_id) (a zip of about $((artifact_bytes / 1000000)) MB)"
          else
            download="the screenshots from [the run]($run_url), which uploaded none; it says why"
          fi
          if [ "$CHECKS" = success ]; then
            checks="✅ The automatic checks passed: the app opened every screen; none is blank or has text behind the status bar; and each shows its tab labels, verse button, and verse numbers, in its language."
          else
            checks="⚠️ **The automatic checks failed or didn't finish.** Start with [the run]($run_url) to see why."
          fi
          approve="an approver in the release-approvers team opens [this run]($run_url), clicks **Review deployments**, ticks **screenshot-review**, and approves. The **Screenshots reviewed** check then passes."

          body=$(cat <<BODY
          <!-- key-screens-review sha=$SHA -->
          ### 📸 Screenshots to review

          The iPhone screenshots for commit \`${SHA:0:7}\` are ready. Someone needs to look through them before this release can merge into \`main\`.

          $checks

          1. **Download** $download and open \`screens/ios/\`. Each file is named \`<screen>-<variant>.png\`: \`default\`, \`dark\`, \`large\` and \`xl\` (150% and 200% app text), \`ios-large-text\` (the iPhone's own largest size), and \`zh\`, \`zh-cn\`, and \`es\`.
          2. **Look for** what a person would notice:
             - text cut off, overlapping, or behind the clock, battery, or Dynamic Island;
             - a verse number split from its verse, or a button label cut short;
             - the wrong language, a blank or half-drawn screen, or a popup covering the page;
             - dark mode or large text that's hard to read.

             The black pill at the top is the Simulator's Dynamic Island; a real iPhone's screenshots leave it out.
          3. **Approve:** $approve

          A new push needs a new approval, and this comment is replaced when its screenshots are ready. The App Store copies are in \`screens/app-store/\`.
          BODY
          )

          # Replace earlier review comments, so the newest screenshots are the only ones offered.
          gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- key-screens-review"))) | .id' |
            while read -r old; do gh api -X DELETE "repos/$REPO/issues/comments/$old" >/dev/null; done
          gh api "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          echo "Posted the review comment for $SHA."

  screenshots-reviewed:
    # A person looks at a release's screenshots before it merges into main
    # (#331). The automatic checks catch a crash, a blank screen, text under
    # the status bar, and missing labels; other layout problems need a person.
    # This job uses the screenshot-review environment, whose required
    # reviewers are the release-approvers team, so it waits, pending rather
    # than failing, until one of them approves on this run. A new push starts
    # a new run, which needs its own approval. The "Main protection" ruleset
    # requires this job's name.
    needs: review-comment
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.head_ref == 'release-candidate' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Screenshots reviewed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: screenshot-review
    permissions:
      # To confirm the environment requires approval and to record who approved.
      actions: read
      deployments: read
    steps:
      - name: Confirm an approver reviewed the screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # GitHub creates a missing environment with no reviewers, and a job
          # in it would pass unreviewed. Fail instead.
          reviewers=$(gh api "repos/$REPO/environments/screenshot-review" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')
          if [ "$reviewers" -lt 1 ]; then
            echo "::error::The screenshot-review environment has no required reviewers, so nobody approved these screenshots. An admin adds the release-approvers team under Settings → Environments → screenshot-review → Required reviewers, then re-runs this job."
            exit 1
          fi
          approvers=$(gh api "repos/$REPO/actions/runs/$RUN_ID/approvals" \
            --jq '[.[] | select(any(.environments[]; .name == "screenshot-review")) | .user.login] | unique | join(", ")' || true)
          echo "Screenshots approved by ${approvers:-an approver}." | tee -a "$GITHUB_STEP_SUMMARY"

  earlier-screens:
    # Re-checks an earlier run's screenshots in a few minutes, instead of a
    # full build, while tuning the text checks.
    if: github.event_name == 'workflow_dispatch' && inputs.screens_from_run != ''
    name: Check the key screens of an earlier run
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      # To download the earlier run's screenshots.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # For sharp, which crops strips for a closer look.
      - name: Install dependencies
        run: npm ci

      - name: Download that run's screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.screens_from_run }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'screens_from_run must be a run ID.' >&2; exit 1; }
          gh run download "$RUN_ID" --repo "$REPO" --pattern 'ios-pr-preview-*-arm64' --dir "$RUNNER_TEMP/earlier"
          SCREENS="$(find "$RUNNER_TEMP/earlier" -type d -name screens -print -quit)"
          test -n "$SCREENS" || { echo 'That run has no key screens.' >&2; exit 1; }
          echo "SCREENS=$SCREENS" >> "$GITHUB_ENV"

      - name: Check the text on the key screens
        run: node scripts/check-screens.cjs --dir "$SCREENS"

      - name: Upload the text that was read
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: key-screen-checks-${{ inputs.screens_from_run }}
          path: |
            ${{ env.SCREENS }}/ocr.json
            ${{ env.SCREENS }}/checks.json
          if-no-files-found: warn
          retention-days: 14
