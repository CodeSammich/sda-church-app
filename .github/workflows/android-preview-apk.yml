name: Android preview APK

# Builds a debug APK of the release PR for testing on Android phones, and
# comments a link to download it. It builds only this repository's
# release-candidate branch, never fork code, and reads no secrets: the APK is
# signed only with Gradle's local debug key. The optional upload to Google
# Drive, which needs secrets and main's context, is a workflow of its own,
# android-preview-apk-drive.yml, which only takes this run's APK.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Concurrency groups span the repository. The event in the name keeps this run
# apart from main's pull_request_target copy, which still runs on the 1.4.0
# release PR, so neither cancels the other.
concurrency:
  group: android-preview-apk-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-pr:
    # Only release PRs, from this repository's release-candidate branch, are
    # eligible; other PRs into main, such as Dependabot's security updates,
    # can't merge there.
    # The build checks out the PR head without credentials.
    if: >-
      github.event.repository.fork == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release-candidate'
    name: Resolve PR head
    runs-on: ubuntu-24.04
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_repository: ${{ steps.pr.outputs.head_repository }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Resolve open pull request head
        id: pr
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo 'pr_number must be a positive integer.' >&2; exit 1 ;;
          esac

          test "$BASE_REF" = main || {
            echo 'The pull request must target main.' >&2
            exit 1
          }
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" || {
            echo 'Fork pull requests are not eligible for this build.' >&2
            exit 1
          }
          head_repository="$HEAD_REPOSITORY"
          head_sha="$HEAD_SHA"

          test -n "$head_repository" && test -n "$head_sha" || {
            echo 'The pull request has no readable head repository or commit.' >&2
            exit 1
          }

          printf 'pr_number=%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"
          printf 'head_repository=%s\n' "$head_repository" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-pr
    if: needs.resolve-pr.result == 'success'
    # The "Main protection" ruleset requires this job name. A release PR reports
    # the name in release-candidate, so a rename needs the ruleset changed while
    # that release PR is open.
    name: Build Android debug APK (ARM)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ needs.resolve-pr.outputs.head_repository }}
          ref: ${{ needs.resolve-pr.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          license_status=0
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || license_status=$?
          set -o pipefail
          test "$license_status" -eq 0

      - name: Install Android SDK tools
        run: |
          set -euo pipefail
          scripts/sdkmanager-install.sh "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/build-tools/37.0.0"

      - name: Build debug ARM APK
        id: apk
        env:
          APK_NAME: sda-church-app-pr-${{ needs.resolve-pr.outputs.pr_number }}-${{ github.run_id }}-arm-debug.apk
        run: |
          set -euo pipefail
          npm run build:android:apk:debug:arm -- --output "$RUNNER_TEMP/$APK_NAME"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK as a workflow artifact
        # Not zipped, so the link downloads the APK itself. The artifact takes
        # the file's name.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ runner.temp }}/${{ steps.apk.outputs.name }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  comment:
    needs: [resolve-pr, build]
    if: needs.build.result == 'success'
    name: Post the test APK link
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # To find this pull request's APKs, and to replace the test APK comment.
      # The job never checks out or runs the pull request's code.
      actions: read
      pull-requests: write
    steps:
      - name: Post the test APK link
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # The build job runs the pull request's code, so this job takes nothing
          # from it, not even the link. It finds each APK in GitHub's list of a
          # run's artifacts, for that run's own commit, so the comment can only
          # link APKs this workflow built for this pull request on github.com.
          # The SHA-256 is the one the upload step recorded with GitHub.
          #
          # A run's APK: "<artifact id> <bytes> <created_at> <digest>", or nothing
          # if the run stored no single unexpired APK of that commit.
          apk() {
            APK_NAME="sda-church-app-pr-$PR-$1-arm-debug.apk" APK_SHA="$2" gh api "repos/$REPO/actions/runs/$1/artifacts" --jq '
              [.artifacts[] | select(.name == env.APK_NAME and .expired == false and .workflow_run.head_sha == env.APK_SHA)]
              | if length == 1 then .[0] | "\(.id) \(.size_in_bytes) \(.created_at) \(.digest // "")" else empty end'
          }
          # When a build finished, in New York time.
          built() { TZ=America/New_York date -d "$1" '+%b %-d, %-I:%M %p %Z'; }
          # A run's commit message, first line only, as plain text: no links or
          # HTML, and cut at a word past 120 characters.
          first_line='.head_commit.message // "" | split("\n")[0] | gsub("\t"; " ") | gsub("[<>\\[\\]]"; "")
            | if length > 120 then (.[0:120] | sub(" [^ ]*$"; "")) + "…" else . end'

          export APK_NAME="sda-church-app-pr-$PR-$RUN_ID-arm-debug.apk"
          found=$(apk "$RUN_ID" "$SHA")
          test -n "$found" || { echo "::error::This run stored no single $APK_NAME from $SHA." >&2; exit 1; }
          read -r apk_id apk_bytes created digest <<<"$found"
          case "$digest" in
            sha256:?*) sha256="${digest#sha256:}" ;;
            *) echo "::error::GitHub gave no SHA-256 for $APK_NAME." >&2; exit 1 ;;
          esac
          APK_URL="https://github.com/$REPO/actions/runs/$RUN_ID/artifacts/$apk_id"
          APK_MB=$((apk_bytes / 1000000))
          message=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq "$first_line") || message=""

          # Earlier builds of this pull request, newest first: the last one of
          # each other commit, up to ten, until their APKs expire. The comment
          # posts without them if GitHub doesn't list them.
          runs=$(gh api "repos/$REPO/actions/workflows/android-preview-apk.yml/runs?event=pull_request&branch=$HEAD_REF&per_page=20" \
            --jq ".workflow_runs[] | select(.status == \"completed\") | [.id, .head_sha, ($first_line)] | @tsv") || runs=""
          earlier="" count=0 seen="$SHA"
          while IFS=$'\t' read -r id sha subject; do
            [ -n "$id" ] && [ "$id" != "$RUN_ID" ] && [ "$count" -lt 10 ] || continue
            case " $seen " in *" $sha "*) continue ;; esac
            old=$(apk "$id" "$sha") || old=""
            [ -n "$old" ] || continue
            read -r old_id old_bytes old_created old_digest <<<"$old"
            seen="$seen $sha"
            count=$((count + 1))
            details="[download](https://github.com/$REPO/actions/runs/$id/artifacts/$old_id), about $((old_bytes / 1000000)) MB"
            case "$old_digest" in sha256:?*) details="$details, SHA-256 \`${old_digest#sha256:}\`" ;; esac
            earlier+="- Commit \`${sha:0:7}\`, built $(built "$old_created") ($details): ${subject:-no commit message}"$'\n'
          done <<<"$runs"
          if [ "$count" -gt 0 ]; then
            earlier=$(printf '<details><summary>Earlier builds of this pull request (%s)</summary>\n\n%s\n</details>' "$count" "$earlier")
          fi

          body=$(cat <<BODY
          <!-- android-test-apk sha=$SHA -->
          ### 📱 Android test APK

          **Newest: commit \`${SHA:0:7}\`, built $(built "$created").** ${message:-No commit message.}

          **[Download \`$APK_NAME\`]($APK_URL)** (about $APK_MB MB). SHA-256: \`$sha256\`

          $earlier

          Sign in to GitHub in the phone's browser first, since GitHub only gives downloads to signed-in users. Each link works for 14 days after its build. To install the newest from Google Drive instead, without signing in, an approver approves **Upload APK to Google Drive** in this pull request's checks.

          It's a test build named **NYCCSDA Preview**, which installs beside the Play version rather than replacing it. Android asks once to allow installs from the browser.

          Each SHA-256 is the one its upload recorded with GitHub. To check a download on a computer, compare it with \`sha256sum\` (\`shasum -a 256\` on a Mac).
          BODY
          )

          # Replace earlier ones, so this is the one test APK comment, newest build first.
          gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- android-test-apk"))) | .id' |
            while read -r old; do gh api -X DELETE "repos/$REPO/issues/comments/$old" >/dev/null; done
          gh api "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          echo "Posted the test APK link for $SHA, with $count earlier builds."
