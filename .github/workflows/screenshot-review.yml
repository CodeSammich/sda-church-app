name: Screenshot review

# A person looks at a release's screenshots before it merges into main (#331).
# The iOS PR preview captures the key screens in test/screens/screens.json and
# fails on a crash, a blank screen, or text under the status bar. Other layout
# problems, such as a cut-off label or a verse number split across two lines,
# need a person. When the PR opens or gets a new push, this posts a notice that
# the screenshots are on the way, since they take about 50 minutes. The iOS PR
# preview then replaces it with the screenshots and what to look for. After checking them, a reviewer adds the
# "screenshots reviewed" label, or replies 👍 and screenshot-approval.yml adds
# it. A new push removes it, so every version of the release gets its own
# review. docs/operations/native-builds.md explains how.
on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  review:
    # Only the release PR into main; others can't merge there anyway.
    if: >-
      startsWith(github.head_ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Screenshots reviewed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Only to read the labels, remove the label after a new push, and post the
      # notice. The job never checks out or runs the pull request's code.
      pull-requests: write
    steps:
      - name: Say the screenshots are on the way
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          ACTION: ${{ github.event.action }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Only when there's a new commit to capture, and not on a re-run.
          case "$ACTION" in opened|reopened|synchronize|ready_for_review) ;; *) exit 0 ;; esac
          [ "$RUN_ATTEMPT" = 1 ] || exit 0
          comments=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- key-screens-review"))) | "\(.id) \(.body | split("\n")[0])"')
          # This commit's screenshots are already posted, as when a PR is reopened.
          if grep -qF "<!-- key-screens-review sha=$SHA -->" <<<"$comments"; then exit 0; fi
          # Earlier screenshots are out of date: remove them, and any earlier notice.
          while read -r id _; do
            [ -n "$id" ] && gh api -X DELETE "repos/$REPO/issues/comments/$id" >/dev/null
          done <<<"$comments"
          # Release branches are named release/x.y.z, so only the slash needs encoding.
          progress="https://github.com/$REPO/actions/workflows/ios-pr-preview.yml?query=branch%3A${HEAD_REF//\//%2F}"
          # A different marker from the screenshots' own, so a 👍 can't approve
          # screenshots that aren't posted yet (see screenshot-approval.yml).
          body=$(cat <<BODY
          <!-- key-screens-review pending sha=$SHA -->
          ### 📸 Screenshots on the way

          The iPhone preview is taking the screenshots for commit \`${SHA:0:7}\`. That takes about 50 minutes ([progress]($progress)). When they're ready, this comment is replaced with them and what to look for.

          Until someone reviews them, the **Screenshots reviewed** check stays red. That's expected.
          BODY
          )
          gh api "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null

      - name: Require a review of this version's screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          # A 👍 reply re-runs this check; a re-run keeps its first event, so
          # the labels come from the API rather than the event.
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name')
          reviewed=false
          if grep -qx 'screenshots reviewed' <<<"$labels"; then reviewed=true; fi
          if [ "$ACTION" = synchronize ] && [ "$RUN_ATTEMPT" = 1 ] && [ "$reviewed" = true ]; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/screenshots%20reviewed" >/dev/null
            echo "::error::New commits need a new review. The iOS PR preview will post this commit's screenshots in a comment on the PR, about 50 minutes after the push; check them, then approve again."
            echo 'New commits need a new review of the screenshots. See the comment on the pull request.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$reviewed" != true ]; then
            echo "::error::Waiting for a review of this commit's screenshots. The iOS PR preview posts them in a comment on the PR, about 50 minutes after each push; after checking them, add the \"screenshots reviewed\" label."
            echo 'Waiting for a review of the screenshots, which the iOS PR preview posts in a comment on the pull request about 50 minutes after each push. After checking them, add the **screenshots reviewed** label.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'A reviewer checked the screenshots for this commit.'
