name: External Dependency Monitor

on:
  schedule:
    # Daily and away from the top of the hour, when scheduled Actions are busiest.
    - cron: "17 17 * * *"
      timezone: "America/New_York"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: external-dependency-monitor
  cancel-in-progress: false

env:
  CI: true

jobs:
  check-external-dependencies:
    # Forks commonly disable Issues, while this monitor opens and updates an
    # alert issue. Keep scheduled/manual monitoring scoped to the canonical repo.
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Check external dependencies
        id: dependency-check
        continue-on-error: true
        run: npm run test:integration:external

      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: external-dependency-report
          path: external-dependency-report.json
          retention-days: 30

      # The issue handling lives in scripts/monitor-alert-issue.cjs, shared
      # with the Store Toolchain Monitor and unit tested.
      - name: Open or update the alert issue
        if: steps.dependency-check.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          # Comma-separated GitHub usernames. Assigning the alert sends them a
          # notification even when they don't watch the repository.
          ALERT_ASSIGNEES: ${{ vars.MONITOR_ALERT_ASSIGNEES }}
        with:
          script: |
            const alerts = require(`${process.env.GITHUB_WORKSPACE}/scripts/monitor-alert-issue.cjs`);
            const report = alerts.readReport('external-dependency-report.json', core);
            const failed = report ? report.checks.filter((check) => check.status === 'failed') : [];
            const failureDetails = failed.length
              ? failed.map((check) => `- **${check.provider}: ${check.name}** — ${check.error}`).join('\n')
              : '- The monitor exited before producing a readable report.';
            const result = await alerts.openOrUpdateAlert({
              github,
              context,
              core,
              title: '[monitor] External dependency health check failed',
              body: [
                'The scheduled external dependency monitor failed.',
                '',
                '### Failed checks',
                '',
                failureDetails,
                '',
                `Run: ${alerts.getRunUrl(context)}`,
                '',
                'The complete machine-readable report is attached as the `external-dependency-report` artifact.',
              ].join('\n'),
              assignees: alerts.parseAssignees(process.env.ALERT_ASSIGNEES),
            });
            core.info(`Alert issue ${result.action}: #${result.number}`);

      - name: Close the alert issue after recovery
        if: steps.dependency-check.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const alerts = require(`${process.env.GITHUB_WORKSPACE}/scripts/monitor-alert-issue.cjs`);
            const result = await alerts.closeAlert({
              github,
              context,
              title: '[monitor] External dependency health check failed',
              body: `Recovered in ${alerts.getRunUrl(context)}.`,
            });
            core.info(`Alert issue: ${result.action}`);

      - name: Mark the workflow unhealthy
        if: steps.dependency-check.outcome == 'failure'
        run: |
          echo "One or more external dependencies failed. See the job summary and alert issue for provider-level details."
          exit 1
