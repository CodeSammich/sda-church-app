name: External Dependency Monitor

on:
  schedule:
    # Daily and away from the top of the hour, when scheduled Actions are busiest.
    - cron: "17 17 * * *"
      timezone: "America/New_York"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: external-dependency-monitor
  cancel-in-progress: false

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-external-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check external dependencies
        id: dependency-check
        continue-on-error: true
        run: npm run test:integration:external

      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-dependency-report
          path: external-dependency-report.json
          retention-days: 30

      - name: Open or update the alert issue
        if: steps.dependency-check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[monitor] External dependency health check failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `@${context.actor}`,
              '',
              'The scheduled external dependency monitor failed.',
              '',
              `Run: ${runUrl}`,
              '',
              'Download the `external-dependency-report` artifact for the failed providers and URLs.',
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close the alert issue after recovery
        if: steps.dependency-check.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[monitor] External dependency health check failed';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recovered in ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Fail the workflow when a dependency is unhealthy
        if: steps.dependency-check.outcome == 'failure'
        run: exit 1
