name: Scheduled Workflows Keepalive

# GitHub turns off a public repository's scheduled workflows after 60 days
# without repository activity. Twice a month this enables every scheduled
# workflow again through the REST API, itself included, with no commit; turns
# back on any that GitHub turned off for inactivity; and opens an alert issue
# for those, or when main has had no commit for 45 days (#658). The logic is in
# scripts/scheduled-workflows-keepalive.cjs, and the admin runbook ("Keeping
# scheduled workflows on") says what to do with the issue. It uses only the
# workflow token.

on:
  schedule:
    # The 1st and 15th, away from the top of the hour. Two runs a month leave
    # a spare if one fails, well inside the 60 days.
    - cron: "23 13 1,15 * *"
      timezone: "America/New_York"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: scheduled-workflows-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    # Forks start with scheduled workflows off and commonly disable Issues.
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # To enable the workflows.
      actions: write
      contents: read
      # To open or close the alert issue.
      issues: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enable the scheduled workflows
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          # Comma-separated GitHub usernames; assigning the issue emails them.
          ALERT_ASSIGNEES: ${{ vars.MONITOR_ALERT_ASSIGNEES }}
        with:
          script: |
            const alerts = require(`${process.env.GITHUB_WORKSPACE}/scripts/monitor-alert-issue.cjs`);
            const keepalive = require(`${process.env.GITHUB_WORKSPACE}/scripts/scheduled-workflows-keepalive.cjs`);
            const workflows = keepalive.findScheduledWorkflows(`${process.env.GITHUB_WORKSPACE}/.github/workflows`);
            const result = await keepalive.keepAlive({ github, context, core, workflows });
            core.info(`Enabled again: ${result.refreshed.map((w) => w.file).join(', ') || 'none'}`);
            core.info(`Turned back on after inactivity: ${result.reenabled.map((w) => w.file).join(', ') || 'none'}`);
            core.info(`Left off by a person: ${result.leftOff.map((w) => `${w.file} (${w.state})`).join(', ') || 'none'}`);
            core.info(`Days since main's last commit: ${result.daysSinceCommit ?? 'unknown'}`);
            const runbook = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/main/docs/operations/admin-runbook.md#keeping-scheduled-workflows-on`;
            const body = keepalive.buildAlert(result, alerts.getRunUrl(context), runbook);
            if (body) {
              const issue = await alerts.openOrUpdateAlert({
                github,
                context,
                core,
                title: keepalive.ALERT_TITLE,
                body,
                priority: 'High',
                assignees: alerts.parseAssignees(process.env.ALERT_ASSIGNEES),
              });
              core.warning(`Scheduled workflows need a look: issue #${issue.number} (${issue.action}).`);
            } else {
              const closed = await alerts.closeAlert({
                github,
                context,
                title: keepalive.ALERT_TITLE,
                body: `Every scheduled workflow is on, and main has a recent commit, as of ${alerts.getRunUrl(context)}.`,
              });
              core.info(`Alert issue: ${closed.action}`);
            }
            if (result.failed.length) core.setFailed(`Couldn't enable ${result.failed.map((w) => w.file).join(', ')}.`);
