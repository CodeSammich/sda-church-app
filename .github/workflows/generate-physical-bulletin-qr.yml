name: Generate physical bulletin QR codes

# The printed bulletin picks these QR images up from Google Drive by file name.
# Their destinations are in scripts/bulletin-qr-codes.json, so changing one is a
# reviewed pull request, and merging it to main regenerates the images here. The
# upload waits for approval of the production environment, so nothing reaches
# Drive unattended; a run nobody approves just expires.
on:
  push:
    branches: [main]
    paths:
      - scripts/bulletin-qr-codes.json
      - scripts/generate-qr.mjs
      - .github/workflows/generate-physical-bulletin-qr.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: generate-physical-bulletin-qr
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Install QR generator
        run: npm ci --legacy-peer-deps

      - name: Generate JPGs
        run: |
          set -euo pipefail
          node -e '
            const codes = require("./scripts/bulletin-qr-codes.json");
            for (const [file, url] of Object.entries(codes)) console.log(`${file}\t${url}`);
          ' | while IFS=$'\t' read -r file url; do
            node scripts/generate-qr.mjs --url "$url" --output "build/qr/$file"
          done

      - name: Upload JPG artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bulletin-qr-codes
          path: build/qr/*_qr_code_368x368.jpg
          if-no-files-found: error

  upload-to-drive:
    needs: generate
    if: needs.generate.result == 'success'
    name: Upload QR codes to Google Drive
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download JPG artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bulletin-qr-codes
          path: ${{ runner.temp }}/bulletin-qr-codes

      # The upload helper comes from the trusted default branch rather than
      # the selected workflow ref because this job receives Google credentials.
      - name: Check out trusted upload helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: trusted-source
          persist-credentials: false

      - name: Upload QR codes to Drive folder
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: 11esgvM1uhY5e94A_eL2ITI0iKNLIFEEr
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON" || {
            echo 'Missing protected production Environment secret CLASPRC_JSON.' >&2
            exit 1
          }
          for file in "$RUNNER_TEMP"/bulletin-qr-codes/*.jpg; do
            node trusted-source/scripts/upload-google-drive.mjs "$file"
          done
