name: Generate physical bulletin QR codes

on:
  workflow_dispatch:
    inputs:
      queens_url:
        description: HTTPS AdventistGiving URL for the Queens bulletin
        required: true
        default: https://adventistgiving.org/donate/AN48CO
        type: string
      brooklyn_url:
        description: HTTPS AdventistGiving URL for the Brooklyn bulletin
        required: true
        default: https://adventistgiving.org/donate/AN48CO
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Install QR generator
        run: npm ci --legacy-peer-deps

      - name: Generate Queens JPG
        env:
          QR_URL: ${{ inputs.queens_url }}
        run: |
          set -euo pipefail
          node scripts/generate-qr.mjs \
            --url "$QR_URL" \
            --output build/qr/queens_adventist_giving_qr_code_368x368.jpg

      - name: Generate Brooklyn JPG
        env:
          QR_URL: ${{ inputs.brooklyn_url }}
        run: |
          set -euo pipefail
          node scripts/generate-qr.mjs \
            --url "$QR_URL" \
            --output build/qr/brooklyn_adventist_giving_qr_code_368x368.jpg

      - name: Upload JPG artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: adventistgiving-qr-codes
          path: build/qr/*_adventist_giving_qr_code_368x368.jpg
          if-no-files-found: error

  upload-to-drive:
    needs: generate
    if: needs.generate.result == 'success'
    name: Upload QR codes to Google Drive
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download JPG artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: adventistgiving-qr-codes
          path: ${{ runner.temp }}/adventistgiving-qr-codes

      # The upload helper comes from the trusted default branch rather than
      # the selected workflow ref because this job receives Google credentials.
      - name: Check out trusted upload helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: trusted-source
          persist-credentials: false

      - name: Upload QR codes to Drive folder
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: 11esgvM1uhY5e94A_eL2ITI0iKNLIFEEr
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON" || {
            echo 'Missing protected production Environment secret CLASPRC_JSON.' >&2
            exit 1
          }
          for file in "$RUNNER_TEMP"/adventistgiving-qr-codes/*.jpg; do
            node trusted-source/scripts/upload-google-drive.mjs "$file"
          done
