name: Generate physical bulletin QR code

on:
  workflow_dispatch:
    inputs:
      url:
        description: HTTPS URL to encode
        required: true
        default: https://adventistgiving.org/donate/AN48CO
        type: string
      filename:
        description: Output PNG filename
        required: true
        default: adventistgiving.png
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out selected ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install QR generator
        run: npm ci --legacy-peer-deps

      - name: Generate PNG
        env:
          QR_URL: ${{ inputs.url }}
          QR_FILENAME: ${{ inputs.filename }}
        run: |
          set -euo pipefail
          case "$QR_FILENAME" in
            *.png) ;;
            *) echo 'Filename must end in .png.' >&2; exit 1 ;;
          esac
          case "$QR_FILENAME" in
            */*|*\\*) echo 'Filename must not contain a directory separator.' >&2; exit 1 ;;
          esac
          node scripts/generate-qr.mjs --url "$QR_URL" --output "build/qr/$QR_FILENAME"

      - name: Upload PNG artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: physical-bulletin-qr
          path: build/qr/*.png
          if-no-files-found: error
