name: Bulletin API Integration

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pr-bulletin-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-bulletin-api:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BULLETIN_API_URL: https://script.google.com/macros/s/AKfycbzBDlptzh5JpDyAiucJBXO4pQXe2hy2X3DL_1t6NixK-2tV3md_WbyhdDAtCGvGCwzX/exec
      BULLETIN_TEST_DATE: "2026-08-08"
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify production bulletin contract
        run: npm run test:integration:bulletin
