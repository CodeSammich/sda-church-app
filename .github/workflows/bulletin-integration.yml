name: Bulletin API Integration

# Checks the production bulletin API's response shape. It calls the deployed
# Apps Script, not the pull request's code, so it runs once per release, on
# the release PR into main, and can be started by hand.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pr-bulletin-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  verify-bulletin-api:
    # A release PR is a release/* branch in this repository. Other PRs into
    # main, such as Dependabot's, can't merge there, so they skip it.
    if: >-
      github.event_name != 'pull_request' ||
      (startsWith(github.head_ref, 'release/') &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BULLETIN_API_URL: https://script.google.com/macros/s/AKfycbzBDlptzh5JpDyAiucJBXO4pQXe2hy2X3DL_1t6NixK-2tV3md_WbyhdDAtCGvGCwzX/exec
      BULLETIN_TEST_DATE: "2026-08-08"
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Verify production bulletin contract
        run: npm run test:integration:bulletin
