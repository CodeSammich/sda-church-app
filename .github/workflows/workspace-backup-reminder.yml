name: Workspace Backup Reminder

# Every three months, opens an issue asking a super administrator to export all
# of the church's Google Workspace data and keep a copy off Google (#461). The
# checklist is in scripts/workspace-backup-reminder.cjs, and the steps are in the
# admin runbook. The export and download are done by hand; this workflow uses no
# credentials beyond opening an issue.

on:
  schedule:
    # Every Monday in January, April, July, and October, away from the top of
    # the hour. The first Monday opens the issue; the others find it and do nothing.
    - cron: "43 10 * 1,4,7,10 1"
      timezone: "America/New_York"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: workspace-backup-reminder
  cancel-in-progress: false

jobs:
  open-backup-reminder:
    # Forks commonly disable Issues. Keep it to the canonical repository.
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Open this quarter's backup issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          # Comma-separated GitHub usernames; assigning the issue emails them.
          ALERT_ASSIGNEES: ${{ vars.MONITOR_ALERT_ASSIGNEES }}
        with:
          script: |
            const alerts = require(`${process.env.GITHUB_WORKSPACE}/scripts/monitor-alert-issue.cjs`);
            const backup = require(`${process.env.GITHUB_WORKSPACE}/scripts/workspace-backup-reminder.cjs`);
            const { year, month } = backup.monthInNewYork();
            const result = await backup.openWorkspaceBackup({
              github,
              context,
              core,
              year,
              month,
              assignees: alerts.parseAssignees(process.env.ALERT_ASSIGNEES),
            });
            core.info(`Workspace backup issue ${result.action}: #${result.number}`);
