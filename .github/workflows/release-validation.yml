name: Release - PR Version Sync

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches:
      - "release/**"

env:
  # Opt into Node.js 24 for all JavaScript actions to resolve deprecation warnings
  # for actions/checkout@v4 and actions/setup-node@v4.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-version-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR release version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          if [[ "$PR_TITLE" =~ ^Release[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)(:|[[:space:]]|$) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error title=Invalid PR title::PR title must use Release <major.minor.patch> number (for example: Release 1.2.3: Describe the changes)."
            exit 1
          fi

          if [[ "$BASE_REF" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
            if [[ "$VERSION" != "$BASE_VERSION" ]]; then
              echo "::error title=Release version mismatch::PR title version $VERSION must match destination branch release/$BASE_VERSION."
              exit 1
            fi
          fi

          echo "Validated release version $VERSION from PR title."

  sync:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Read and validate merged PR version
        id: release-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PR_TITLE=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq 'map(select(.merged_at != null)) | first | .title // empty')

          if [[ ! "$PR_TITLE" =~ ^Release[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)(:|[[:space:]]|$) ]]; then
            echo "::error title=Invalid PR title::PR title must use Release <major.minor.patch> number (for example: Release 1.2.3: Describe the changes)."
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"

          if [[ "$BASE_REF" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
            if [[ "$VERSION" != "$BASE_VERSION" ]]; then
              echo "::error title=Release version mismatch::PR title version $VERSION must match destination branch release/$BASE_VERSION."
              exit 1
            fi
          fi

          echo "Using release version $VERSION from merged PR title: $PR_TITLE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync release version
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          npm run sync-version -- --version "$VERSION"
          git add package.json package-lock.json app.json public/sw.js

          if ! git diff --cached --quiet; then
            git commit -m "chore: sync configuration files to $VERSION [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "Files are already in sync with $VERSION."
          fi
