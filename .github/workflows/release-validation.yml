name: Release - PR Version Sync

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: release-version-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Only the release PR into main carries a version, in its title
      # ("Release/x.y.z: Summary"); feature PRs into release-candidate pass with
      # any title. The Main protection and PR approval rulesets both require
      # this job, so it has to report on every pull request.
      - name: Validate PR release version
        id: release-version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          VERSION="$(node scripts/release-version-policy.cjs)"

          if [[ -n "$VERSION" ]]; then
            echo "Validated release version $VERSION from the PR title."
          else
            echo "Not a release PR into main; the title needs no version."
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  sync:
    needs: validate-pr
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'release-candidate' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.repository == 'New-York-Chinese-Seventh-day-Adventist/sda-church-app'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"

      - name: Verify release version files
        env:
          VERSION: ${{ needs.validate-pr.outputs.version }}
        run: |
          set -euo pipefail

          npm run sync-version -- --version "$VERSION"

          if ! git diff --exit-code -- package.json package-lock.json app.json public/sw.js; then
            echo "::error title=Version files out of sync::Run npm run sync-version -- --version $VERSION and commit the generated changes to release-candidate through a pull request."
            exit 1
          fi

          echo "Files are in sync with $VERSION."
