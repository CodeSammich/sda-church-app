name: Release - PR Version Sync

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

env:
  # Opt into Node.js 24 for all JavaScript actions to resolve deprecation warnings
  # for actions/checkout@v4 and actions/setup-node@v4.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-version-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Validate PR release version
        id: release-version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          VERSION="$(node scripts/release-version-policy.cjs)"

          echo "Validated release version $VERSION from PR title."
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  sync:
    needs: validate-pr
    if: >-
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.repository == 'New-York-Chinese-Seventh-day-Adventist/sda-church-app'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"

      - name: Verify release version files
        env:
          VERSION: ${{ needs.validate-pr.outputs.version }}
        run: |
          set -euo pipefail

          npm run sync-version -- --version "$VERSION"

          if ! git diff --exit-code -- package.json package-lock.json app.json public/sw.js; then
            echo "::error title=Version files out of sync::Run npm run sync-version -- --version $VERSION and commit the generated changes to this release branch through a pull request."
            exit 1
          fi

          echo "Files are in sync with $VERSION."
