name: Release - PR Version Sync

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

env:
  # Opt into Node.js 24 for all JavaScript actions to resolve deprecation warnings
  # for actions/checkout@v4 and actions/setup-node@v4.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-version-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Validate PR release version
        id: release-version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$PR_TITLE" =~ ^Release/([0-9]+\.[0-9]+\.[0-9]+)(:|[[:space:]]|$) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error title=Invalid PR title::PR title must use Release/<major.minor.patch> (for example: Release/1.2.3: Describe the changes)."
            exit 1
          fi

          if [[ "$BASE_REF" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
            if [[ "$VERSION" != "$BASE_VERSION" ]]; then
              echo "::error title=Release version mismatch::PR title version $VERSION must match destination branch release/$BASE_VERSION."
              exit 1
            fi
          fi

          if [[ "$HEAD_REPOSITORY" == "$REPOSITORY" ]] &&
            [[ "$HEAD_REF" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            HEAD_VERSION="${BASH_REMATCH[1]}"
            if [[ "$VERSION" != "$HEAD_VERSION" ]]; then
              echo "::error title=Release version mismatch::PR title version $VERSION must match source branch release/$HEAD_VERSION."
              exit 1
            fi
          fi

          echo "Validated release version $VERSION from PR title."
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  sync:
    needs: validate-pr
    if: >-
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.repository == 'New-York-Chinese-Seventh-day-Adventist/sda-church-app'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Sync release version
        env:
          VERSION: ${{ needs.validate-pr.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          npm run sync-version -- --version "$VERSION"
          git add package.json package-lock.json app.json public/sw.js

          if ! git diff --cached --quiet; then
            git commit -m "chore: sync configuration files to $VERSION"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          else
            echo "Files are already in sync with $VERSION."
          fi
