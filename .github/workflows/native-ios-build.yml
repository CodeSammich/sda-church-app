name: Native iOS build

on:
  # Signed iOS builds run from trusted main/release pushes, protected manual
  # dispatches, and release/** -> main pull requests whose head branch is in
  # this repository. There is deliberately no generic pull-request trigger
  # because this job reads production signing secrets.
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: native-ios-production
  cancel-in-progress: false

jobs:
  ios_build_ipa:
    name: iOS Build IPA
    # Do not attach the production Environment to a manual run from an
    # arbitrary branch. Only trusted main/release pushes or release/** -> main
    # pull requests whose head branch is in this repository may reach secrets.
    if: >-
      github.event.repository.fork == false &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/release/') ||
        (
          github.event_name == 'pull_request' &&
          github.base_ref == 'main' &&
          startsWith(github.head_ref, 'release/') &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    # SECURITY CONTRACT: This job can read Apple signing secrets. Never add
    # `set -x`, secret-byte logging, environment dumps, or artifacts containing
    # certificates, profiles, keychains, passwords, or tokens. Keep signing
    # material limited to the explicitly reviewed steps below.
    environment: production
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Require a protected release branch
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            test "$GITHUB_BASE_REF" = 'main' || {
              echo 'Pull-request builds must target main.' >&2
              exit 1
            }
            case "$GITHUB_HEAD_REF" in
              release/*) ;;
              *)
                echo 'Pull-request builds must originate from a release/* branch.' >&2
                exit 1
                ;;
            esac
          else
            case "$GITHUB_REF" in
              refs/heads/main|refs/heads/release/*) ;;
              *)
                echo 'Run this workflow only from main or a release/* branch.' >&2
                exit 1
                ;;
            esac
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Select and verify Xcode tools
        run: |
          set -euo pipefail
          XCODE_DEVELOPER_DIR='/Applications/Xcode_26.2.app/Contents/Developer'
          test -d "$XCODE_DEVELOPER_DIR" || {
            echo "Expected Xcode at $XCODE_DEVELOPER_DIR; update this workflow when the runner image changes." >&2
            exit 1
          }
          sudo xcode-select -s "$XCODE_DEVELOPER_DIR"
          xcodebuild -version
          pod --version

      # Install dependencies and generate the native project before restoring
      # signing material. These steps receive no Apple secrets.
      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: >-
          npx expo prebuild
          --template expo-template-bare-minimum@58.0.0-canary-20260902-26df09e
          --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Read iOS build number
        id: ios-version
        run: |
          set -euo pipefail
          IOS_BUILD_NUMBER="$(node -p "require('./app.json').expo.ios.buildNumber || ''")"
          case "$IOS_BUILD_NUMBER" in
            ''|*[!0-9]*) echo 'Set expo.ios.buildNumber in app.json to a positive integer.' >&2; exit 1 ;;
          esac
          test "$IOS_BUILD_NUMBER" -ge 1 || {
            echo 'expo.ios.buildNumber must be at least 1.' >&2
            exit 1
          }
          printf 'ios_build_number=%s\n' "$IOS_BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Restore Apple signing material
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          # SECURITY: Secret bytes are decoded only into temporary files. Do
          # not print, inspect, upload, or include these files in diagnostics.
          set -euo pipefail
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" || {
            echo 'Set IOS_DISTRIBUTION_CERTIFICATE_BASE64 in the protected production Environment.'
            exit 1
          }
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" || {
            echo 'Set IOS_DISTRIBUTION_CERTIFICATE_PASSWORD in the protected production Environment.'
            exit 1
          }
          test -n "$IOS_PROVISIONING_PROFILE_BASE64" || {
            echo 'Set IOS_PROVISIONING_PROFILE_BASE64 in the protected production Environment.'
            exit 1
          }
          test -n "$IOS_TEAM_ID" || {
            echo 'Set IOS_TEAM_ID in the protected production Environment.'
            exit 1
          }

          CERTIFICATE_PATH="$RUNNER_TEMP/nyccsda-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/nyccsda-app-store.mobileprovision"
          PROFILE_PLIST_PATH="$RUNNER_TEMP/nyccsda-profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/nyccsda-signing.keychain-db"

          # macOS base64 uses -D for decoding. Both commands write directly to
          # files; neither sends secret bytes to the log.
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$PROFILE_PATH"
          test -s "$CERTIFICATE_PATH"
          test -s "$PROFILE_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST_PATH"
          PROFILE_UUID="$(plutil -extract UUID raw -o - "$PROFILE_PLIST_PATH")"
          PROFILE_NAME="$(plutil -extract Name raw -o - "$PROFILE_PLIST_PATH")"
          PROFILE_TEAM_ID="$(plutil -extract TeamIdentifier.0 raw -o - "$PROFILE_PLIST_PATH")"
          PROFILE_APP_ID="$(plutil -extract Entitlements.application-identifier raw -o - "$PROFILE_PLIST_PATH")"
          BUNDLE_IDENTIFIER="$(node -p 'require("./app.json").expo.ios.bundleIdentifier')"

          test "$PROFILE_TEAM_ID" = "$IOS_TEAM_ID" || {
            echo 'The provisioning profile team does not match IOS_TEAM_ID.' >&2
            exit 1
          }
          test "$PROFILE_APP_ID" = "$IOS_TEAM_ID.$BUNDLE_IDENTIFIER" || {
            echo 'The provisioning profile application identifier does not match the app bundle identifier.' >&2
            exit 1
          }

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          # Use an ephemeral keychain. Its password is generated on the runner
          # and is never stored as a repository or GitHub secret.
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" /Library/Keychains/System.keychain
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null

          # These values are metadata or paths, not private signing material.
          # They are passed to later steps without exposing certificate bytes or
          # passwords to the build command.
          {
            printf 'IOS_KEYCHAIN_PATH=%s\n' "$KEYCHAIN_PATH"
            printf 'IOS_PROFILE_UUID=%s\n' "$PROFILE_UUID"
            printf 'IOS_PROFILE_NAME=%s\n' "$PROFILE_NAME"
            printf 'IOS_BUNDLE_IDENTIFIER=%s\n' "$BUNDLE_IDENTIFIER"
            printf 'IOS_TEAM_ID=%s\n' "$IOS_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Archive and export IPA
        env:
          # Pushes and manual runs deliberately share the same checked-in
          # maintainer-controlled source of truth.
          IOS_BUILD_NUMBER: ${{ steps.ios-version.outputs.ios_build_number }}
        run: |
          set -euo pipefail
          case "$IOS_BUILD_NUMBER" in
            ''|*[!0-9]*) echo 'expo.ios.buildNumber must be a positive integer.' >&2; exit 1 ;;
          esac
          test "$IOS_BUILD_NUMBER" -ge 1 || {
            echo 'expo.ios.buildNumber must be at least 1.' >&2
            exit 1
          }

          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE" || {
            echo 'No generated iOS workspace was found.' >&2
            exit 1
          }
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/nyccsda-export-options.plist"

          # The export plist contains only public build metadata. Generate it
          # at runtime so signing configuration is not committed to source.
          EXPORT_OPTIONS_PATH="$EXPORT_OPTIONS_PATH" \
          IOS_TEAM_ID="$IOS_TEAM_ID" \
          IOS_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
          IOS_PROFILE_NAME="$IOS_PROFILE_NAME" \
          node <<'NODE'
          const fs = require('node:fs');
          const escapeXml = (value) => String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&apos;');
          const {
            EXPORT_OPTIONS_PATH,
            IOS_TEAM_ID,
            IOS_BUNDLE_IDENTIFIER,
            IOS_PROFILE_NAME,
          } = process.env;
          fs.writeFileSync(EXPORT_OPTIONS_PATH, `<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${escapeXml(IOS_TEAM_ID)}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${escapeXml(IOS_BUNDLE_IDENTIFIER)}</key><string>${escapeXml(IOS_PROFILE_NAME)}</string>
            </dict>
          </dict>
          </plist>
          `);
          NODE

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/nyccsda.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            archive

          rm -rf "$RUNNER_TEMP/nyccsda-ios-export"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/nyccsda.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -exportPath "$RUNNER_TEMP/nyccsda-ios-export"

      - name: Remove Apple signing material before artifact upload
        if: always()
        run: |
          # SECURITY: Remove the certificate, profile, generated keychain, and
          # archive before any third-party artifact step runs. Never upload them.
          set +e
          rm -f "$RUNNER_TEMP/nyccsda-distribution.p12"
          rm -f "$RUNNER_TEMP/nyccsda-app-store.mobileprovision"
          rm -f "$RUNNER_TEMP/nyccsda-profile.plist"
          rm -f "$RUNNER_TEMP/nyccsda-export-options.plist"
          if [ -n "${IOS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          security delete-keychain "${IOS_KEYCHAIN_PATH:-$RUNNER_TEMP/nyccsda-signing.keychain-db}" >/dev/null 2>&1
          rm -rf "$RUNNER_TEMP/nyccsda.xcarchive"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: native-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nyccsda-ios-export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Remove exported IPA from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/nyccsda-ios-export"
