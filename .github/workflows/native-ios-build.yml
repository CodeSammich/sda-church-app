name: Native iOS build

on:
  # Signed iOS builds run only after a commit reaches main, or from a protected
  # manual dispatch on main. There is deliberately no pull-request trigger
  # because this job reads production signing secrets.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ios-production
  cancel-in-progress: false

jobs:
  ios_build_ipa:
    name: iOS Build IPA
    # Do not attach the production Environment to a manual run from an
    # arbitrary branch. Only the trusted main branch may reach signing secrets.
    if: >-
      github.event.repository.fork == false &&
      github.ref == 'refs/heads/main'
    # SECURITY CONTRACT: This job can read Apple signing secrets. Never add
    # `set -x`, secret-byte logging, environment dumps, or artifacts containing
    # certificates, profiles, keychains, passwords, or tokens. Keep signing
    # material limited to the explicitly reviewed steps below.
    environment: production
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Require the main branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || {
            echo 'Signed iOS builds must run from main.' >&2
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Select and verify Xcode tools
        run: |
          set -euo pipefail
          XCODE_DEVELOPER_DIR='/Applications/Xcode_26.6.app/Contents/Developer'
          test -d "$XCODE_DEVELOPER_DIR" || {
            echo "Expected Xcode at $XCODE_DEVELOPER_DIR; update this workflow when the runner image changes." >&2
            exit 1
          }
          sudo xcode-select -s "$XCODE_DEVELOPER_DIR"
          xcodebuild -version
          pod --version

      # Install dependencies and generate the native project before restoring
      # signing material. These steps receive no Apple secrets.
      - name: Install dependencies
        run: npm ci --force

      - name: Generate iOS project
        run: >-
          npx expo prebuild
          --template expo-template-bare-minimum@58.0.3
          --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Compute iOS build number
        id: ios-version
        run: |
          # The build number is computed from the version (0.40.0 → 40000), the
          # same way app.config.js does; see docs/operations/version-numbers.md.
          set -euo pipefail
          if node -e 'process.exit("buildNumber" in (require("./app.json").expo.ios || {}) ? 0 : 1)'; then
            echo 'Remove expo.ios.buildNumber from app.json. It is computed from the version; see docs/operations/version-numbers.md.' >&2
            exit 1
          fi
          APP_VERSION="$(node -p 'require("./app.json").expo.version')"
          IOS_BUILD_NUMBER="$(node scripts/store-build-number.cjs "$APP_VERSION")"
          echo "Building version $APP_VERSION with build number $IOS_BUILD_NUMBER."
          printf 'ios_build_number=%s\n' "$IOS_BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Restore Apple signing material
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          # SECURITY: Secret bytes are decoded only into temporary files. Do
          # not print, inspect, upload, or include these files in diagnostics.
          set -euo pipefail
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" || {
            echo 'Set IOS_DISTRIBUTION_CERTIFICATE_BASE64 in the protected production Environment.'
            exit 1
          }
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" || {
            echo 'Set IOS_DISTRIBUTION_CERTIFICATE_PASSWORD in the protected production Environment.'
            exit 1
          }
          test -n "$IOS_PROVISIONING_PROFILE_BASE64" || {
            echo 'Set IOS_PROVISIONING_PROFILE_BASE64 in the protected production Environment.'
            exit 1
          }
          test -n "$IOS_TEAM_ID" || {
            echo 'Set IOS_TEAM_ID in the protected production Environment.'
            exit 1
          }

          CERTIFICATE_PATH="$RUNNER_TEMP/nyccsda-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/nyccsda-app-store.mobileprovision"
          PROFILE_PLIST_PATH="$RUNNER_TEMP/nyccsda-profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/nyccsda-signing.keychain-db"

          # macOS base64 uses -D for decoding. Both commands write directly to
          # files; neither sends secret bytes to the log.
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$PROFILE_PATH"
          test -s "$CERTIFICATE_PATH"
          test -s "$PROFILE_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST_PATH"
          PROFILE_UUID="$(plutil -extract UUID raw -o - "$PROFILE_PLIST_PATH")"
          PROFILE_NAME="$(plutil -extract Name raw -o - "$PROFILE_PLIST_PATH")"
          PROFILE_TEAM_ID="$(plutil -extract TeamIdentifier.0 raw -o - "$PROFILE_PLIST_PATH")"
          PROFILE_APP_ID="$(plutil -extract Entitlements.application-identifier raw -o - "$PROFILE_PLIST_PATH")"
          BUNDLE_IDENTIFIER="$(node -p 'require("./app.json").expo.ios.bundleIdentifier')"

          test "$PROFILE_TEAM_ID" = "$IOS_TEAM_ID" || {
            echo 'The provisioning profile team does not match IOS_TEAM_ID.' >&2
            exit 1
          }
          test "$PROFILE_APP_ID" = "$IOS_TEAM_ID.$BUNDLE_IDENTIFIER" || {
            echo 'The provisioning profile application identifier does not match the app bundle identifier.' >&2
            exit 1
          }

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          # Use an ephemeral keychain. Its password is generated on the runner
          # and is never stored as a repository or GitHub secret.
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" /Library/Keychains/System.keychain
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null

          # These values are metadata or paths, not private signing material.
          # They are passed to later steps without exposing certificate bytes or
          # passwords to the build command.
          {
            printf 'IOS_KEYCHAIN_PATH=%s\n' "$KEYCHAIN_PATH"
            printf 'IOS_PROFILE_UUID=%s\n' "$PROFILE_UUID"
            printf 'IOS_PROFILE_NAME=%s\n' "$PROFILE_NAME"
            printf 'IOS_BUNDLE_IDENTIFIER=%s\n' "$BUNDLE_IDENTIFIER"
            printf 'IOS_TEAM_ID=%s\n' "$IOS_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Archive and export IPA
        env:
          # Pushes and manual runs both compute it from the version in app.json.
          IOS_BUILD_NUMBER: ${{ steps.ios-version.outputs.ios_build_number }}
        run: |
          set -euo pipefail
          case "$IOS_BUILD_NUMBER" in
            ''|*[!0-9]*) echo 'The iOS build number must be a positive integer.' >&2; exit 1 ;;
          esac
          test "$IOS_BUILD_NUMBER" -ge 1 || {
            echo 'The iOS build number must be at least 1.' >&2
            exit 1
          }

          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE" || {
            echo 'No generated iOS workspace was found.' >&2
            exit 1
          }
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/nyccsda-export-options.plist"

          # The export plist contains only public build metadata. Generate it
          # at runtime so signing configuration is not committed to source.
          EXPORT_OPTIONS_PATH="$EXPORT_OPTIONS_PATH" \
          IOS_TEAM_ID="$IOS_TEAM_ID" \
          IOS_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
          IOS_PROFILE_NAME="$IOS_PROFILE_NAME" \
          node <<'NODE'
          const fs = require('node:fs');
          const escapeXml = (value) => String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&apos;');
          const {
            EXPORT_OPTIONS_PATH,
            IOS_TEAM_ID,
            IOS_BUNDLE_IDENTIFIER,
            IOS_PROFILE_NAME,
          } = process.env;
          fs.writeFileSync(EXPORT_OPTIONS_PATH, `<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${escapeXml(IOS_TEAM_ID)}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${escapeXml(IOS_BUNDLE_IDENTIFIER)}</key><string>${escapeXml(IOS_PROFILE_NAME)}</string>
            </dict>
          </dict>
          </plist>
          `);
          NODE

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/nyccsda.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            archive

          rm -rf "$RUNNER_TEMP/nyccsda-ios-export"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/nyccsda.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -exportPath "$RUNNER_TEMP/nyccsda-ios-export"

      - name: Remove Apple signing material before artifact upload
        if: always()
        run: |
          # SECURITY: Remove the certificate, profile, generated keychain, and
          # archive before any third-party artifact step runs. Never upload them.
          set +e
          rm -f "$RUNNER_TEMP/nyccsda-distribution.p12"
          rm -f "$RUNNER_TEMP/nyccsda-app-store.mobileprovision"
          rm -f "$RUNNER_TEMP/nyccsda-profile.plist"
          rm -f "$RUNNER_TEMP/nyccsda-export-options.plist"
          if [ -n "${IOS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          security delete-keychain "${IOS_KEYCHAIN_PATH:-$RUNNER_TEMP/nyccsda-signing.keychain-db}" >/dev/null 2>&1
          rm -rf "$RUNNER_TEMP/nyccsda.xcarchive"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: native-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nyccsda-ios-export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Remove exported IPA from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/nyccsda-ios-export"

  signing_dates:
    name: Check the recorded Apple signing dates
    needs: ios_build_ipa
    # Compares .github/apple-signing-expiry.json, which the Apple Signing
    # Monitor reads, with the provisioning profile inside the IPA just built,
    # and warns if they differ, such as after a renewal that forgot the file.
    # It reads no secrets: the profile inside the IPA holds only public dates
    # and certificates, no key.
    if: >-
      github.event.repository.fork == false &&
      github.ref == 'refs/heads/main' &&
      needs.ios_build_ipa.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Download IPA
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nyccsda-ipa
      - name: Compare the recorded dates with the build
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/nyccsda-ipa" -name '*.ipa' -print -quit)"
          test -n "$IPA" || { echo 'The IPA artifact has no .ipa file.' >&2; exit 1; }
          unzip -p "$IPA" 'Payload/*.app/embedded.mobileprovision' > "$RUNNER_TEMP/embedded.mobileprovision"
          node scripts/check-apple-signing-expiry.cjs --profile "$RUNNER_TEMP/embedded.mobileprovision"

  testflight_upload:
    name: Upload to TestFlight
    needs: ios_build_ipa
    # The App Store Connect key lives in its own store-upload environment, apart
    # from the signing secrets, and this job runs no npm packages. It skips
    # until the key's secrets are set. See
    # docs/operations/native-builds.md#automatic-store-uploads.
    if: >-
      github.event.repository.fork == false &&
      github.ref == 'refs/heads/main' &&
      needs.ios_build_ipa.result == 'success'
    # SECURITY CONTRACT: This job can read the App Store Connect API key. Never
    # add `set -x`, secret logging, environment dumps, or artifact uploads.
    environment: store-upload
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Download IPA
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nyccsda-ipa

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_API_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_PRIVATE_KEY" ]; then
            echo '::notice title=TestFlight upload skipped::Add the three APP_STORE_CONNECT_API_* secrets to the store-upload environment to upload automatically.'
            exit 0
          fi
          case "$APP_STORE_CONNECT_API_KEY_ID" in
            *[!A-Za-z0-9]*) echo 'APP_STORE_CONNECT_API_KEY_ID must be only letters and digits.' >&2; exit 1 ;;
          esac
          IPA="$(find "$RUNNER_TEMP/nyccsda-ipa" -name '*.ipa' -print -quit)"
          test -n "$IPA" || { echo 'The IPA artifact has no .ipa file.' >&2; exit 1; }

          # SECURITY: altool finds the key by file name in this folder. The file
          # is removed when the step ends, however it ends.
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          trap 'rm -f "$KEY_PATH"' EXIT
          mkdir -p "$KEY_DIR"
          (umask 077 && printf '%s\n' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$KEY_PATH")

          LOG="$RUNNER_TEMP/altool.log"
          status=0
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" 2>&1 | tee "$LOG" || status=$?

          # altool has reported some errors with a zero exit code, so check its
          # output too.
          if [ "$status" -eq 0 ] && ! grep -qE '\*\*\* Error|ERROR ITMS-' "$LOG"; then
            echo 'Uploaded to App Store Connect. The build appears in TestFlight once Apple finishes processing it.' >> "$GITHUB_STEP_SUMMARY"
          elif grep -q 'ITMS-90189' "$LOG"; then
            # ITMS-90189: this build number is already uploaded, as on a rerun.
            echo '::warning title=Already on TestFlight::App Store Connect already has this build number, so there was nothing new to upload.'
          else
            echo '::error title=TestFlight upload failed::altool could not upload the IPA; see its output above.'
            exit 1
          fi

      - name: Remove the IPA and API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/nyccsda-ipa" "$HOME/.appstoreconnect/private_keys"
