name: Native Android build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      android:
        description: Build Android for Google Play (AAB)
        type: boolean
        default: false
      android_apk:
        description: Build Android for direct installation (APK)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    # Do not attach the production Environment to a manual run from an
    # arbitrary branch. Only the trusted main branch may reach signing secrets.
    if: >-
      github.event.repository.fork == false &&
      github.ref == 'refs/heads/main'
    # SECURITY CONTRACT: This job can read production signing secrets. Never add
    # `set -x`, secret-byte logging (`echo`/`printf`/`cat` to the terminal),
    # debug dumps, or an artifact/upload step that includes secret files. Keep
    # secret-bearing work limited to the explicitly reviewed steps below.
    environment: production
    name: ${{ matrix.target.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Android AAB
            input: android
            platform: android
            extension: aab
            profile: production
          - name: Android APK
            input: android_apk
            platform: android
            extension: apk
            profile: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main'
        run: npm ci --force
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        if: (github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main') && matrix.target.platform == 'android'
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        if: (github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main') && matrix.target.platform == 'android'
        with:
          # License acceptance is performed in the next step so this action
          # cannot block on an interactive prompt on the hosted runner.
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: ''
      - name: Accept Android SDK licenses noninteractively
        if: (github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main') && matrix.target.platform == 'android'
        run: |
          # SECURITY: SDK license text is not a secret, but keep it out of the
          # log. This step must remain noninteractive on GitHub-hosted runners.
          set -euo pipefail
          license_status=0
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || license_status=$?
          set -o pipefail
          test "$license_status" -eq 0
      - name: Install Android SDK tools
        if: (github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main') && matrix.target.platform == 'android'
        run: |
          # Android 37 uses the versioned 37.0 platform package name.
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
          test -d "$ANDROID_HOME/platforms/android-37.0" || {
            echo 'Android SDK platform android-37.0 is unavailable on this runner.' >&2
            exit 1
          }
          test -d "$ANDROID_HOME/build-tools/37.0.0" || {
            echo 'Android build tools 37.0.0 are unavailable on this runner.' >&2
            exit 1
          }

      - name: Restore Android upload keystore
        if: github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # SECURITY: This is the only intentional shell write involving the
          # encoded secret. Its stdout is piped directly into base64 decoding
          # and redirected to a file; it must never be printed, inspected, or
          # uploaded.
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Set the protected production Environment secret ANDROID_KEYSTORE_BASE64 first.'; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nyccsda-upload.keystore"
          chmod 600 "$RUNNER_TEMP/nyccsda-upload.keystore"
          test -s "$RUNNER_TEMP/nyccsda-upload.keystore"
      - name: Compile signed binary on GitHub runner
        if: github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nyccsda-upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_EXTENSION: ${{ matrix.target.extension }}
        run: |
          # SECURITY: Signing values are environment inputs for Gradle only.
          # Never add shell tracing (`set -x`), verbose environment dumps, or
          # commands that echo/cat these variables or include them in artifacts.
          set -euo pipefail
          if [ "$BUILD_EXTENSION" = 'aab' ]; then
            npm run build:android -- --output "$RUNNER_TEMP/app.$BUILD_EXTENSION"
          else
            npm run build:android:apk -- --output "$RUNNER_TEMP/app.$BUILD_EXTENSION"
          fi
      - name: Remove Android signing material
        if: always()
        run: |
          # SECURITY: Always remove the decoded private keystore, including after
          # failed builds. Do not replace this with an artifact upload or log dump.
          rm -f "$RUNNER_TEMP/nyccsda-upload.keystore"

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: native-${{ matrix.target.platform }}-${{ matrix.target.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app.${{ matrix.target.extension }}
          if-no-files-found: error
          retention-days: 14

  play_upload:
    name: Upload to Google Play internal testing
    needs: build
    # It signs in without a key: GitHub vouches that the job runs in this
    # repository's store-upload environment on main, and Google returns a token
    # that expires within an hour. The job never sees the signing secrets and
    # runs no npm packages; the upload script uses only Node's built-ins. It
    # skips until the two settings are added. See
    # docs/operations/native-builds.md#automatic-store-uploads.
    if: >-
      github.event.repository.fork == false &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' &&
      (github.event_name == 'push' || inputs.android)
    # SECURITY CONTRACT: This job can get a Google Play upload token. Never add
    # `set -x`, secret logging, environment dumps, or artifact uploads.
    environment: store-upload
    permissions:
      contents: read
      # Lets the job ask GitHub for the identity token that Google checks.
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Download AAB
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-android-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nyccsda-aab
      - name: Upload to internal testing
        env:
          # Not keys, just which provider and account to use. They're secrets so
          # the logs of this public repository don't show the project number.
          GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER" ] || [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT" ]; then
            echo '::notice title=Google Play upload skipped::Add GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER and GOOGLE_PLAY_SERVICE_ACCOUNT to the store-upload environment to upload automatically.'
            exit 0
          fi
          # The release PR's title, the subject of the squash-merge commit,
          # becomes the "What's new" text testers see.
          RELEASE_COMMIT_SUBJECT="$(git log -1 --format=%s)" \
            node scripts/upload-google-play.cjs "$RUNNER_TEMP/nyccsda-aab/app.aab"

  release:
    # A manual build should produce artifacts only; publish a GitHub Release
    # only after a successful push to main.
    if: >-
      github.event.repository.fork == false &&
      github.event_name == 'push' &&
      needs.build.result == 'success' &&
      github.ref == 'refs/heads/main'
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read release version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Download built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A GitHub release already exists for $RELEASE_TAG. Bump package.json version before building another release."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Release $RELEASE_TAG" \
            --notes "Signed native binaries built from commit $GITHUB_SHA." \
            --latest
