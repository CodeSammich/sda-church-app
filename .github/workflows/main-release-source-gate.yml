name: Main Release Source Gate

# Uses pull_request_target so the check runs from main's copy of this file: a
# pull request can't edit the gate to pass. It checks out no code.
# pull_request_target must stay allowed in the repository's Actions event
# policy (Settings → Actions → Policies); GitHub blocks the trigger in public
# repositories without one from November 2, 2026. A test keeps the list of
# workflows that use it reviewed. See
# docs/operations/admin-runbook.md#actions-event-policy-for-pull_request_target.
on:
  pull_request_target:
    branches:
      - main
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  ensure_pr_to_main_from_release_branch:
    name: ensure_pr_to_main_from_release_branch
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Require an organization release branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$BASE_REF" != "main" ]]; then
            echo "::error title=Unexpected destination::This gate only accepts pull requests targeting main."
            exit 1
          fi

          if [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            echo "::error title=Fork pull request blocked::Pull requests to main must come from a release branch in $REPOSITORY, not $HEAD_REPOSITORY."
            exit 1
          fi

          if [[ ! "$HEAD_REF" =~ ^release/[0-9]+\.[0-9]+\.(x|[0-9]+)$ ]]; then
            echo "::error title=Invalid release source::Pull requests to main must come from an organization branch named release/x.y.(patch|x). Received $HEAD_REF."
            exit 1
          fi

          echo "Validated $HEAD_REPOSITORY:$HEAD_REF as an approved source for main."
