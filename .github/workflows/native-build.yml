name: Native binaries

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:
    inputs:
      ios:
        description: Build iOS for TestFlight / App Store
        type: boolean
        default: false
      android:
        description: Build Android for Google Play (AAB)
        type: boolean
        default: false
      android_apk:
        description: Build Android for direct installation (APK)
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    if: github.event.repository.fork == false
    # SECURITY CONTRACT: This job can read production signing secrets. Never add
    # `set -x`, secret-byte logging (`echo`/`printf`/`cat` to the terminal),
    # debug dumps, or an artifact/upload step that includes secret files. Keep
    # secret-bearing work limited to the explicitly reviewed steps below.
    environment: production
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.platform == 'ios' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: iOS store
            input: ios
            platform: ios
            buildSystem: eas-local
            profile: production
            extension: ipa
          - name: Android store
            input: android
            platform: android
            buildSystem: native
            extension: aab
            profile: production
          - name: Android APK
            input: android_apk
            platform: android
            buildSystem: native
            extension: apk
            profile: preview
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        with:
          node-version: 22
          cache: npm
      - name: Check account setup
        if: (github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && matrix.target.buildSystem == 'eas-local'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Set the EXPO_TOKEN secret in the protected production Environment first.'; exit 1; }
          node -e 'if (!require("./app.json").expo.extra?.eas?.projectId) { console.error("Link the church Expo project with eas init first. See docs/operations/native-builds.md."); process.exit(1); }'
      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        run: npm ci
      - uses: actions/setup-java@v4
        if: (github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && matrix.target.platform == 'android'
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        if: (github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && matrix.target.platform == 'android'
      - name: Install Android SDK tools
        if: (github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && matrix.target.platform == 'android'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Restore Android upload keystore
        if: (github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && matrix.target.buildSystem == 'native'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # SECURITY: This is the only intentional shell write involving the
          # encoded secret. Its stdout is piped directly into base64 decoding
          # and redirected to a file; it must never be printed, inspected, or
          # uploaded.
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Set the protected production Environment secret ANDROID_KEYSTORE_BASE64 first.'; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nyccsda-upload.keystore"
          chmod 600 "$RUNNER_TEMP/nyccsda-upload.keystore"
          test -s "$RUNNER_TEMP/nyccsda-upload.keystore"
      - name: Select and verify iOS tools
        if: (github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && matrix.target.platform == 'ios'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          pod --version
          fastlane --version
      - name: Compile signed binary on GitHub runner
        if: github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nyccsda-upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_PLATFORM: ${{ matrix.target.platform }}
          BUILD_PROFILE: ${{ matrix.target.profile }}
          BUILD_EXTENSION: ${{ matrix.target.extension }}
          BUILD_SYSTEM: ${{ matrix.target.buildSystem }}
        run: |
          # SECURITY: Signing values are environment inputs for Gradle/EAS only.
          # Never add shell tracing (`set -x`), verbose environment dumps, or
          # commands that echo/cat these variables or include them in artifacts.
          set -euo pipefail
          if [ "$BUILD_SYSTEM" = 'native' ]; then
            if [ "$BUILD_EXTENSION" = 'aab' ]; then
              npm run build:android -- --output "$RUNNER_TEMP/app.$BUILD_EXTENSION"
            else
              npm run build:android:apk -- --output "$RUNNER_TEMP/app.$BUILD_EXTENSION"
            fi
          else
            npx eas-cli@23.2.0 build --platform "$BUILD_PLATFORM" --profile "$BUILD_PROFILE" --local --non-interactive --output "$RUNNER_TEMP/app.$BUILD_EXTENSION"
          fi
      - name: Upload binary
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs[matrix.target.input] || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        with:
          name: native-${{ matrix.target.platform }}-${{ matrix.target.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app.${{ matrix.target.extension }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove Android signing material
        if: always() && matrix.target.buildSystem == 'native'
        run: |
          # SECURITY: Always remove the decoded private keystore, including after
          # failed builds. Do not replace this with an artifact upload or log dump.
          rm -f "$RUNNER_TEMP/nyccsda-upload.keystore"

  release:
    if: github.event.repository.fork == false && needs.build.result == 'success' && github.ref == 'refs/heads/main'
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read release version
        id: version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A GitHub release already exists for $RELEASE_TAG. Bump package.json version before building another release."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Release $RELEASE_TAG" \
            --notes "Signed native binaries built from commit $GITHUB_SHA." \
            --latest
