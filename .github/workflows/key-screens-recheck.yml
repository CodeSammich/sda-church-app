name: Key screens recheck

# Checks the text on an earlier run's key screens again, in a few minutes,
# without building or capturing anything: for tuning scripts/check-screens.cjs.
# Give it a run of iOS key screens (ios-key-screens.yml) or Android key screens
# (android-key-screens.yml), and the platform. It's started only by hand, so
# it never shows on pull requests as a skipped check, as it did while it was a
# job in those two workflows. Like them, it reads no secret.
# docs/operations/native-builds.md ("Text checks") explains it.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Whose key screens to check.
        type: choice
        options:
          - android
          - ios
        required: true
        default: android
      screens_from_run:
        description: >-
          The ID of the earlier iOS key screens or Android key screens run,
          from its address.
        type: string
        required: true

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform == 'android'
    name: Check the Android key screens of an earlier run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # To download the earlier run's screenshots.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # For sharp, which crops strips for a closer look.
      - name: Install dependencies
        run: npm ci

      - name: Install the text reader
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ocr"
          "$RUNNER_TEMP/ocr/bin/pip" install --quiet -r scripts/ocr-requirements.txt
          echo "OCR_PYTHON=$RUNNER_TEMP/ocr/bin/python" >> "$GITHUB_ENV"

      - name: Download that run's screenshots
        id: earlier
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.screens_from_run }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'screens_from_run must be a run ID.' >&2; exit 1; }
          # The joined download, and each group's own, which a run keeps for a
          # day and may have alone if its join failed. Each has a screens
          # folder, so all their shots go into one, and every group's are
          # checked, not just the first folder's.
          gh run download "$RUN_ID" --repo "$REPO" --pattern 'android-key-screens-*' --dir "$RUNNER_TEMP/earlier"
          screens="$RUNNER_TEMP/screens"
          mkdir -p "$screens/android"
          find "$RUNNER_TEMP/earlier" -path '*/screens/android/*.png' -exec cp {} "$screens/android/" \;
          count=$(find "$screens/android" -name '*.png' | wc -l)
          test "$count" -gt 0 || { echo 'That run has no key screens.' >&2; exit 1; }
          echo "Checking the $count screenshots in that run's downloads."
          echo "screens=$screens" >> "$GITHUB_OUTPUT"

      - name: Check the text on the key screens
        env:
          SCREENS: ${{ steps.earlier.outputs.screens }}
        run: node scripts/check-screens.cjs --dir "$SCREENS" --platform android

      - name: Upload the text that was read
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-key-screen-checks-${{ inputs.screens_from_run }}
          path: |
            ${{ steps.earlier.outputs.screens }}/ocr.json
            ${{ steps.earlier.outputs.screens }}/checks.json
          if-no-files-found: warn
          retention-days: 14

  ios:
    # On a Mac: the iPhone shots are read by Apple's Vision.
    if: inputs.platform == 'ios'
    name: Check the iPhone key screens of an earlier run
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      # To download the earlier run's screenshots.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # For sharp, which crops strips for a closer look.
      - name: Install dependencies
        run: npm ci

      - name: Download that run's screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.screens_from_run }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'screens_from_run must be a run ID.' >&2; exit 1; }
          # Runs from before the screenshots got their own download kept them in
          # the app's download.
          gh run download "$RUN_ID" --repo "$REPO" --pattern 'ios-key-screens-*' --dir "$RUNNER_TEMP/earlier" ||
            gh run download "$RUN_ID" --repo "$REPO" --pattern 'ios-pr-preview-*-arm64' --dir "$RUNNER_TEMP/earlier"
          SCREENS="$(find "$RUNNER_TEMP/earlier" -type d -name screens -print -quit)"
          test -n "$SCREENS" || { echo 'That run has no key screens.' >&2; exit 1; }
          echo "SCREENS=$SCREENS" >> "$GITHUB_ENV"

      - name: Check the text on the key screens
        run: node scripts/check-screens.cjs --dir "$SCREENS"

      - name: Upload the text that was read
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: key-screen-checks-${{ inputs.screens_from_run }}
          path: |
            ${{ env.SCREENS }}/ocr.json
            ${{ env.SCREENS }}/checks.json
          if-no-files-found: warn
          retention-days: 14
