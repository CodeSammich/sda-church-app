name: Deploy Web Preview and Tag

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-and-tag:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"

      # Keep npm lifecycle scripts away from any write-capable GitHub token.
      # The checkout above deliberately does not persist credentials in .git/config.
      - name: Install dependencies
        run: npm ci

      - name: Validate, tag package version, and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # This token-bearing remote is needed only after npm ci has completed.
          # Always scrub it from Git metadata before the step exits.
          cleanup() {
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          VERSION=$(jq -r .version package.json)
          TAG="v$VERSION"
          echo "Version identified: $VERSION"

          npm run sync-version

          if ! git diff --exit-code -- package.json package-lock.json app.json public/sw.js; then
            echo "::error title=Version files out of sync::Run npm run sync-version and commit the generated changes through the release pull request."
            exit 1
          fi

          echo "Configuration files are in sync."

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping tag creation."
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Successfully tagged $TAG"
          fi
          npm run deploy:production
