name: Android PR preview

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: android-pr-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-pr:
    # pull_request_target runs the workflow from the trusted base repository.
    # Only same-repository PR heads are eligible. The build checks out the PR
    # head without credentials; the Drive upload checks out only the trusted
    # base commit's upload helper.
    if: >-
      github.event.repository.fork == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Resolve PR head
    runs-on: ubuntu-24.04
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_repository: ${{ steps.pr.outputs.head_repository }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      trusted_sha: ${{ steps.pr.outputs.trusted_sha }}
    steps:
      - name: Resolve open pull request head
        id: pr
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo 'pr_number must be a positive integer.' >&2; exit 1 ;;
          esac

          test "$BASE_REF" = main || {
            echo 'The pull request must target main.' >&2
            exit 1
          }
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" || {
            echo 'Fork pull requests are not eligible for this build.' >&2
            exit 1
          }
          head_repository="$HEAD_REPOSITORY"
          head_sha="$HEAD_SHA"
          trusted_sha="$BASE_SHA"

          test -n "$head_repository" && test -n "$head_sha" || {
            echo 'The pull request has no readable head repository or commit.' >&2
            exit 1
          }
          test -n "$trusted_sha" || {
            echo 'The trusted base commit could not be resolved.' >&2
            exit 1
          }

          printf 'pr_number=%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"
          printf 'head_repository=%s\n' "$head_repository" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"
          printf 'trusted_sha=%s\n' "$trusted_sha" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-pr
    if: needs.resolve-pr.result == 'success'
    name: Build ARM debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ needs.resolve-pr.outputs.head_repository }}
          ref: ${{ needs.resolve-pr.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84efbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --force

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          license_status=0
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || license_status=$?
          set -o pipefail
          test "$license_status" -eq 0

      - name: Install Android SDK tools
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/build-tools/37.0.0"

      - name: Build debug ARM APK
        run: npm run build:android:apk:debug:arm -- --output "$RUNNER_TEMP/app.apk"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-pr-preview-${{ needs.resolve-pr.outputs.pr_number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/app.apk
          if-no-files-found: error
          retention-days: 14

  upload:
    needs: [resolve-pr, build]
    if: needs.build.result == 'success'
    name: Upload APK to Google Drive
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # This job receives only the APK artifact. It does not check out or run
      # PR code. The upload helper is checked out from the trusted base commit.
      - name: Download APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-pr-preview-${{ needs.resolve-pr.outputs.pr_number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/android-pr-preview

      - name: Check out trusted upload helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-pr.outputs.trusted_sha }}
          path: trusted-source
          persist-credentials: false

      - name: Upload APK to personal Google Drive
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_FILE_NAME: sda-church-app-pr-${{ needs.resolve-pr.outputs.pr_number }}-${{ github.run_id }}-arm-debug.apk
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON" || {
            echo 'Missing protected production Environment secret CLASPRC_JSON.' >&2
            exit 1
          }
          node trusted-source/scripts/upload-google-drive.mjs "$RUNNER_TEMP/android-pr-preview/app.apk" | tee "$RUNNER_TEMP/google-drive-upload.txt"
          cat "$RUNNER_TEMP/google-drive-upload.txt" >> "$GITHUB_STEP_SUMMARY"
