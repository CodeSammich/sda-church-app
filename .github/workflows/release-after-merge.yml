name: Release - After Merge

# After a merge into main, creates release-candidate again for the next release
# (GitHub deletes it when the release pull request merges), moves the feature
# pull requests GitHub moved to main back to it, and comments on the merged
# pull request with links to the runs that wait for production approval. It
# checks out no code.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-after-merge
  cancel-in-progress: false

jobs:
  next-steps:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - name: Find the merged pull request
        id: pr
        run: |
          set -euo pipefail
          # The squash-merge commit is linked to the pull request it came from,
          # but GitHub can take a few seconds to link it: 1.3.0's had no link
          # 7 seconds after the merge (#486). So ask for about a minute. A
          # direct push to main never gets one, so the comment step skips.
          for try in $(seq 1 6); do
            found=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '
              [.[] | select(.merged_at != null and .base.ref == "main")][0] // empty
              | "number=\(.number)\nhead_ref=\(.head.ref)"') || found=''
            if [[ -n "$found" ]]; then
              echo "$found" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$try" -lt 6 ]]; then sleep 10; fi
          done
          echo "No pull request merged into main has this commit, so it was a direct push."

      - name: Create release-candidate from main
        id: branch
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          branch_exists() {
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release-candidate" --silent 2>/dev/null
          }

          # GitHub deletes release-candidate moments after the release pull
          # request merges. Wait for that, so it isn't recreated only to be
          # deleted.
          if [[ "$HEAD_REF" == "release-candidate" ]]; then
            for _ in $(seq 1 12); do
              branch_exists || break
              sleep 10
            done
            if branch_exists; then
              echo "::warning title=release-candidate not deleted::It still holds the released commits. Delete it, then create it from main."
              echo "result=stale" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif branch_exists; then
            echo "release-candidate already exists; leaving it alone."
            echo "result=exists" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never overwrites: creating a branch that already exists fails.
          if gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/heads/release-candidate -f sha="$GITHUB_SHA" --silent; then
            echo "Created release-candidate at $GITHUB_SHA."
            echo "result=created" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=release-candidate not created::Create it from main on the branches page."
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

      # When GitHub deletes release-candidate after the release merges, it
      # moves the pull requests open against it to main. Only release-candidate
      # may merge into main, so every other open pull request into main belongs
      # on release-candidate. Bots' pull requests, such as Dependabot's, target
      # main by their own settings, so they stay, and the comment names them in
      # case one had been moved to release-candidate by hand.
      - name: Move feature pull requests back to release-candidate
        id: moved
        if: >-
          steps.pr.outputs.head_ref == 'release-candidate' &&
          steps.branch.outputs.result == 'created'
        run: |
          set -euo pipefail
          declare -A seen=()
          moved=()
          failed=()
          bots=()
          # GitHub may still be moving them, so look three times.
          for try in 1 2 3; do
            pulls=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" \
              --jq '.[] | "\(.number) \(.user.type)"') || pulls=''
            while read -r number type; do
              [[ -n "$number" && -z "${seen[$number]:-}" ]] || continue
              seen[$number]=1
              if [[ "$type" == "Bot" ]]; then
                bots+=("$number")
              elif gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" -f base=release-candidate --silent < /dev/null; then
                echo "Moved #$number back to release-candidate."
                moved+=("$number")
              else
                echo "::warning title=Pull request not moved::Change #$number's base to release-candidate."
                failed+=("$number")
              fi
            done <<< "$pulls"
            if [[ "$try" -lt 3 ]]; then sleep 10; fi
          done
          echo "moved=${moved[*]}" >> "$GITHUB_OUTPUT"
          echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"
          echo "bots=${bots[*]}" >> "$GITHUB_OUTPUT"

      - name: Comment the next steps on the pull request
        if: steps.pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BRANCH_RESULT: ${{ steps.branch.outputs.result }}
          MOVED: ${{ steps.moved.outputs.moved }}
          FAILED: ${{ steps.moved.outputs.failed }}
          BOTS: ${{ steps.moved.outputs.bots }}
        run: |
          set -euo pipefail
          # The same push starts each of these workflows. Link this merge's run,
          # where the approval button is, or the workflow page if it's missing.
          run_link() {
            local file=$1 name=$2 url=''
            for _ in $(seq 1 6); do
              url=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$file/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
                --jq '.workflow_runs[0].html_url // empty')
              [[ -n "$url" ]] && break
              sleep 10
            done
            echo "- [$name](${url:-$REPO_URL/actions/workflows/$file}) ([all runs]($REPO_URL/actions/workflows/$file))$3"
          }

          # "12 34" becomes "#12, #34".
          numbers() {
            local out='' n
            for n in $1; do out+="${out:+, }#$n"; done
            echo "$out"
          }

          branches="[branches page]($REPO_URL/branches)"
          on_main="[open pull requests into \`main\`]($REPO_URL/pulls?q=is%3Apr+is%3Aopen+base%3Amain)"
          case "$BRANCH_RESULT" in
            created)
              branch_line="Created \`release-candidate\` from this merge for the next release ($branches)." ;;
            stale)
              branch_line="\`release-candidate\` wasn't deleted, so it still holds this release's commits. Delete it on the $branches, then create it again from \`main\`. Deleting it moves its open pull requests to \`main\`, so then change their base back to \`release-candidate\` ($on_main)." ;;
            exists)
              branch_line="\`release-candidate\` already exists ($branches)." ;;
            *)
              branch_line="Couldn't create \`release-candidate\`. Create it from \`main\` on the $branches, then change the base of the pull requests GitHub moved to \`main\` back to it ($on_main)." ;;
          esac

          {
            echo "Merged into \`main\`. These runs wait for \`production\` approval:"
            echo
            run_link native-ios-build.yml 'Native iOS build' ''
            run_link native-android-build.yml 'Native Android build' ''
            run_link apps-script-deploy.yml 'Deploy Bulletin Apps Script' ': approve when nobody is making a bulletin, or reject it to skip this deploy.'
            echo
            echo "$branch_line"
            if [[ -n "${MOVED:-}" ]]; then
              echo
              echo "Moved $(numbers "$MOVED") from \`main\` to \`release-candidate\`, where feature pull requests belong."
            fi
            if [[ -n "${FAILED:-}" ]]; then
              echo
              echo "Couldn't move $(numbers "$FAILED") back to \`release-candidate\`. Change each one's base on its page."
            fi
            if [[ -n "${BOTS:-}" ]]; then
              echo
              echo "Left $(numbers "$BOTS") on \`main\`, since bots such as Dependabot open their pull requests there. Change each one's base to \`release-candidate\` when it should go into a release."
            fi
          } > comment.md

          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -F body=@comment.md --silent
          echo "Commented on #$PR_NUMBER."
