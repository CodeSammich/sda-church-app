name: PR Version Check

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

permissions:
  contents: read

jobs:
  enforce-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for version change
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          git fetch origin main
          BASE_VER=$(git show origin/main:package.json | jq -r .version)
          HEAD_VER=$(jq -r .version package.json)

          echo "Base version (main): $BASE_VER"
          echo "PR version: $HEAD_VER"

          if [ "$BASE_VER" == "$HEAD_VER" ]; then
            # Only a release PR may reuse main's version, and only to recover
            # a release whose tag was never made.
            if [ "$HEAD_REF" != "release-candidate" ]; then
              echo "::error::Validation Failed: The version in package.json has not been changed."
              exit 1
            fi

            if git rev-parse --verify --quiet "refs/tags/v$HEAD_VER" >/dev/null; then
              echo "::error::Validation Failed: Version $HEAD_VER has already been tagged."
              exit 1
            fi

            echo "Validation Passed: allowing recovery of untagged version $HEAD_VER."
            exit 0
          fi

          # The store build numbers are computed from the version, and Google Play
          # accepts only higher ones, so a release must raise it; see
          # docs/operations/version-numbers.md.
          BASE_BUILD="$(node scripts/store-build-number.cjs "$BASE_VER")"
          HEAD_BUILD="$(node scripts/store-build-number.cjs "$HEAD_VER")"
          if [ "$HEAD_BUILD" -le "$BASE_BUILD" ]; then
            echo "::error::Validation Failed: Version $HEAD_VER must be higher than main's $BASE_VER. The store build number ($HEAD_BUILD) comes from it and has to go up."
            exit 1
          fi

          echo "Validation Passed."
