name: PR Unit Tests

on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: pr-unit-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  unit-tests:
    name: Jest unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Run unit tests
        run: npm test -- --ci

      - name: Check that text follows the app's text size
        run: npm run check:text-scale
